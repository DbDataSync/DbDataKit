# The shared test engines, for every product and the shared libraries: one definition of each database, started the same way on a
# developer machine and in CI. Each engine is a compose *profile*, so `testenv.sh up mssql postgres` starts only what a suite needs.
# See docs/plans/11-ci-and-testing.md.
#
# Host ports are fixed and documented here so a suite's connection settings never depend on discovery:
#
#   mssql              14330   SQL Server 2022, user sa, SQL Server Agent on (Sync's CDC needs it)
#   mssql-target       14331   a second SQL Server 2022, user sa: Sync's cross-instance replication and its targets
#   postgres           15432   PostgreSQL 17 with TLS, user postgres
#   postgres-logical   15433   PostgreSQL 17 with wal_level=logical and wal2json, user dbdatasync (see below)
#   mysql              13306   MySQL 9, user root
#   mariadb            13307   MariaDB 11, user root
#   oracle             15210   Oracle Database Free 23ai (gvenzl/oracle-free:23-slim), service FREEPDB1, user dbkit (sys/system: the same password)
#
# The slow engines, which only DbDataBuild's conformance suite uses (its nightly full run starts them; `testenv.sh up` with no engine
# named leaves them out, `testenv.sh up all` starts everything):
#
#   mssql2025          14332   SQL Server 2025, user sa (no Agent): Build's probes and one load at database compatibility levels 170 and 160
#   spark              10000   Apache Spark 4.0 Thrift server (HiveServer2, http mode), ANSI mode: dialect probes only
#   bigquery            9050   the goccy BigQuery emulator, project ddb: dialect probes only
#   flight             31337   an Arrow Flight SQL server (voltrondata/sqlflite, DuckDB behind it), plain, user sqlflite_username: an origin only
#   flight-tls         31338   the same with TLS (a certificate made when it starts; `testenv.sh env` copies its CA out for the `ca_file` option)
#
# This is the one test-engine environment of the repository: DbDataSync's own docker-compose.yml is gone, its engines are the profiles
# above, and every suite starts what it needs with `testenv.sh up`. The two things Sync needed that the other suites do not:
#
# - `postgres-logical` is a separate engine on purpose, the one place where two engines of the same kind run side by side. Logical
#   decoding needs `wal_level=logical`, a restart-requiring server setting, and the wal2json plugin, which no public image carries (it is
#   built from testenv/postgres-logical/Dockerfile on a freshly pulled `postgres:17`; DBKIT_TEST_PULL=false skips the pull, for a machine that is offline or rate-limited). Turning that on for the plain `postgres`
#   would change the server every other suite tests against (TLS, default settings, the Debian build Build's conformance suite pins
#   differences to) to suit one product, so Sync's slot tests get their own server on its own port.
# - `oracle` mounts testenv/oracle-init: Sync's flashback reader needs EXECUTE on DBMS_FLASHBACK and FLASHBACK ANY TABLE for the app
#   user (`dbkit`), and a pre-existing table (Oracle's flashback version query refuses a table created seconds ago). The init scripts run
#   on the container's first start; harmless for the other suites.
#
# None of the engines keeps data between runs (no volumes): `testenv.sh down` removes everything, and every suite creates its own
# databases and tables. The users and the password are the same for every engine (DBKIT_TEST_PASSWORD, default DbKit_Test_Pw1), except
# that Sync's PostgreSQL user stays `dbdatasync`.
name: dbkit-test

x-password: &password ${DBKIT_TEST_PASSWORD:-DbKit_Test_Pw1}

# Images from 2025 onward ship /opt/mssql-tools18 only, whose sqlcmd needs -C for the container's self-signed certificate;
# try that first and fall back, since `:2022-latest` moves under you.
x-mssql-health: &mssql-health
  test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 15s

services:
  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbkit-test-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *password
      # CDC's capture is a SQL Server Agent job: without Agent `sp_cdc_enable_table` succeeds and then nothing is ever captured
      # (Sync's CDC reader would wait for an LSN that never comes). The image ships Agent but leaves it stopped. Harmless for the other
      # suites; only this instance has it, the target is written to and never captured from.
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "14330:1433"
    healthcheck: *mssql-health

  # The second SQL Server, for Sync's cross-instance replication (source on 14330, target here) and anything that must cross servers.
  mssql-target:
    profiles: [mssql-target]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbkit-test-mssql-target
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *password
    ports:
      - "14331:1433"
    healthcheck: *mssql-health

  postgres:
    profiles: [postgres]
    image: postgres:17
    container_name: dbkit-test-postgres
    # TLS on with a throwaway self-signed certificate, like SQL Server's container, so the libraries' secure default
    # (encrypt, with verification switched off for the self-signed cert) is what the live tests exercise.
    entrypoint:
      - sh
      - -c
      - >-
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj /CN=localhost
        -keyout /tmp/server.key -out /tmp/server.crt 2>/dev/null
        && chown postgres:postgres /tmp/server.key /tmp/server.crt && chmod 600 /tmp/server.key
        && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *password
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # PostgreSQL for Sync's logical-decoding reader; see the header for why it is its own engine. Built, not pulled.
  postgres-logical:
    profiles: [postgres-logical]
    build:
      context: ./postgres-logical
      pull: ${DBKIT_TEST_PULL:-true}
    image: dbkit-test-postgres-logical:17
    container_name: dbkit-test-postgres-logical
    # wal_level=logical is what lets a replication slot decode anything at all; it is a restart-requiring setting on a real server,
    # which is the single biggest adoption obstacle of this mechanism and why the provisioner checks it before proposing a slot.
    #
    # max_replication_slots defaults to 10. Sync's slots are one per source table, not one per replication (PgLogicalSlotReader says
    # why a shared slot cannot be advanced safely), so the default is a low ceiling for anything but a toy replication.
    #
    # Since PostgreSQL 18.6/17.11/16.15/15.19/14.24 (the fix for CVE-2026-6471) an output plugin library has to be listed in
    # output_plugin_libraries before a slot may use it; without wal2json there, creating a slot fails with `library "wal2json" may not
    # be used as an output plugin`.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,wal2json
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    environment:
      POSTGRES_USER: dbdatasync
      POSTGRES_PASSWORD: *password
      POSTGRES_DB: dbdatasync
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbdatasync"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  mysql:
    profiles: [mysql]
    image: mysql:9
    container_name: dbkit-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: *password
      MYSQL_DATABASE: dbkit
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb:
    profiles: [mariadb]
    image: mariadb:11
    container_name: dbkit-test-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: *password
      MARIADB_DATABASE: dbkit
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The slowest to start (a couple of minutes the first time). Ask for it only when a suite needs it. Sync's Oracle flashback-reader
  # tests also need EXECUTE on DBMS_FLASHBACK and FLASHBACK ANY TABLE for the app user and a table with some age: oracle-init/ does that
  # on first start (the image runs every script in /container-entrypoint-initdb.d once the app user exists).
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim
    container_name: dbkit-test-oracle
    environment:
      ORACLE_PASSWORD: *password
      APP_USER: dbkit
      APP_USER_PASSWORD: *password
    ports:
      - "15210:1521"
    volumes:
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # ---- the slow engines (see the header): DbDataBuild's conformance suite only ----
  # None of these has a healthcheck of its own that the image can be trusted to run (the images are minimal), so testenv.sh waits for
  # their readiness from the host (a log line or an HTTP answer) after `docker compose up --wait`.

  # The four images below are pinned by digest (D29): a moving tag changes answers without a change of ours. To move one, read the new digest with
  # `docker buildx imagetools inspect <image:tag>`, put it after the tag, and run the Build conformance suite on that engine before merging.
  mssql2025:
    profiles: [mssql2025]
    image: ${DBKIT_TEST_MSSQL2025_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3}
    container_name: dbkit-test-mssql2025
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *password
    ports:
      - "14332:1433"
    healthcheck: *mssql-health

  # The Thrift server (HiveServer2) in http mode, which the ADBC Spark driver speaks; Spark 4 in its default ANSI mode.
  spark:
    profiles: [spark]
    image: ${DBKIT_TEST_SPARK_IMAGE:-apache/spark:4.0.0@sha256:a89782d90529a623fc4471cdddb0f9c32d6eed10a81b256a80207b23c3b1df00}
    container_name: dbkit-test-spark
    command:
      - /opt/spark/bin/spark-submit
      - --class
      - org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      - --name
      - thrift
      - /opt/spark/jars/spark-hive-thriftserver_2.13-4.0.0.jar
      - --hiveconf
      - hive.server2.transport.mode=http
      - --hiveconf
      - hive.server2.thrift.http.port=10000
      - --hiveconf
      - hive.server2.thrift.http.path=cliservice
      - --hiveconf
      - hive.server2.thrift.bind.host=0.0.0.0
    ports:
      - "10000:10000"

  bigquery:
    profiles: [bigquery]
    image: ${DBKIT_TEST_BIGQUERY_IMAGE:-ghcr.io/goccy/bigquery-emulator:latest@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393}
    container_name: dbkit-test-bigquery
    command: ["--project=ddb", "--port=9050"]
    ports:
      - "9050:9050"

  flight:
    profiles: [flight]
    image: &flight-image ${DBKIT_TEST_FLIGHT_IMAGE:-voltrondata/sqlflite:latest@sha256:4fc872838d71d26757bf4bbe7c23e128cae2c3e008df0f15f30fb513d6be26ba}
    container_name: dbkit-test-flight
    environment:
      SQLFLITE_PASSWORD: *password
      TLS_ENABLED: "0"
      PRINT_QUERIES: "0"
    ports:
      - "31337:31337"

  flight-tls:
    profiles: [flight-tls]
    image: *flight-image
    container_name: dbkit-test-flight-tls
    environment:
      SQLFLITE_PASSWORD: *password
      TLS_ENABLED: "1"
      PRINT_QUERIES: "0"
    ports:
      - "31338:31337"
