# The shared test engines, for every product and the shared libraries: one definition of each database, started the same way on a
# developer machine and in CI. Each engine is a compose *profile*, so `testenv.sh up mssql postgres` starts only what a suite needs.
# See docs/plans/11-ci-and-testing.md.
#
# Host ports are fixed and documented here so a suite's connection settings never depend on discovery:
#
#   mssql      14330     SQL Server 2022, user sa
#   postgres   15432     PostgreSQL 17, user postgres
#   mysql      13306     MySQL 9, user root
#   mariadb    13307     MariaDB 11, user root
#   oracle     15210     Oracle Database Free 23ai (gvenzl/oracle-free:23-slim), service FREEPDB1, user dbkit (sys/system: the same password)
#
# (DbDataSync's own docker-compose.yml still runs its engines on 14330/14331/15432/...; it moves into this file engine by
# engine, and the two can't run together on one machine until it has.)
name: dbkit-test

x-password: &password ${DBKIT_TEST_PASSWORD:-DbKit_Test_Pw1}

services:
  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbkit-test-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *password
    ports:
      - "14330:1433"
    healthcheck:
      # Images from 2025 onward ship /opt/mssql-tools18 only, whose sqlcmd needs -C for the container's self-signed certificate;
      # try that first and fall back, since `:2022-latest` moves under you.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  postgres:
    profiles: [postgres]
    image: postgres:17
    container_name: dbkit-test-postgres
    # TLS on with a throwaway self-signed certificate, like SQL Server's container, so the libraries' secure default
    # (encrypt, with verification switched off for the self-signed cert) is what the live tests exercise.
    entrypoint:
      - sh
      - -c
      - >-
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj /CN=localhost
        -keyout /tmp/server.key -out /tmp/server.crt 2>/dev/null
        && chown postgres:postgres /tmp/server.key /tmp/server.crt && chmod 600 /tmp/server.key
        && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *password
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  mysql:
    profiles: [mysql]
    image: mysql:9
    container_name: dbkit-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: *password
      MYSQL_DATABASE: dbkit
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb:
    profiles: [mariadb]
    image: mariadb:11
    container_name: dbkit-test-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: *password
      MARIADB_DATABASE: dbkit
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The slowest to start (a couple of minutes the first time). Ask for it only when a suite needs it. A generic engine: Sync's Oracle flashback-reader tests
  # also need EXECUTE on DBMS_FLASHBACK and FLASHBACK ANY TABLE for their user, which DbDataSync/docker/oracle-init grants on Sync's own stack.
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim
    container_name: dbkit-test-oracle
    environment:
      ORACLE_PASSWORD: *password
      APP_USER: dbkit
      APP_USER_PASSWORD: *password
    ports:
      - "15210:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
