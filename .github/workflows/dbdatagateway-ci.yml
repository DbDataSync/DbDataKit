name: DbDataGateway CI

# DbDataGateway on the trunk model (docs/releases.md): short feature branches, a pull request
# into `main` that runs this, and a rebase merge. There is no dev/test lane and nothing here moves a branch. A rebase merge makes new
# commits, so the run on `main` is the one that validates what landed, and it is what dbdatagateway-release.yml looks for.
#
# A `changes` job skips the suites when nothing of DbDataGateway's, of the shared DbDataKit/ code it builds against, or of the test
# environment changed; the run then still reports success. The shared libraries' own suite is dbdatakit-ci.yml, run once, not per product.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatagateway-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataGateway

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataGateway/|DbDataKit/|testenv/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdatagateway-|_)|actions/setup-product))'

  # The Windows service, DPAPI, ACLs, the 32-bit worker and the text ODBC driver only exist here, so this is the only job that
  # exercises them; it also packages the release zip as a smoke test.
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    # Observed: 3 minutes (the installer tests add a little). The ceiling fails a hung test fast.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataGateway
          global-json: DbDataGateway/global.json
      - run: dotnet build DbDataGateway.slnf -c Release
      - name: Test
        shell: pwsh
        run: |
          # the failed tests are named again at the end: between them the hosts' own log lines run to thousands of lines
          dotnet test --project tests/DbDataGateway.Tests -c Release --no-build --minimum-expected-tests 100 2>&1 | Tee-Object -FilePath gateway-tests.log
          $code = $LASTEXITCODE
          Write-Host '--- failed tests ---'
          Select-String -Path gateway-tests.log -Pattern 'failed DbDataGateway' -Context 0,6 | ForEach-Object { Write-Host $_.Line; $_.Context.PostContext | ForEach-Object { Write-Host "    $_" } }
          exit $code
      - name: Package (smoke test)
        run: ./build/package.ps1 -Version 0.0.0-ci
        shell: pwsh

  # Linux against a real SQL Server (the ODBC and SqlClient paths) and a real PostgreSQL, plus everything that is not Windows-specific. The server is the
  # shared one from testenv/, the same SQL Server the shared libraries' live tests use.
  linux:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Observed: 1.5 minutes. Starting the engine adds a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataGateway
          global-json: DbDataGateway/global.json
      - name: Test the test-environment scripts
        working-directory: .
        run: testenv/selftest.sh
      - name: Start SQL Server and PostgreSQL (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up mssql postgres
      - name: Point the suite at them
        working-directory: .
        run: testenv/testenv.sh env dbdatagateway --dotenv >> "$GITHUB_ENV"
      - name: Install the SQL Server ODBC driver
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      # The app template builds with the pinned Bun from the vendored package store (plan 22a GP32, GP33): the store is made from the web workspace's packages, so Node and
      # `npm ci` are needed, and the tests that build apps fail rather than skip without them.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch the pinned Bun and install the web workspace's packages
        working-directory: .
        run: |
          scripts/fetch-bun.sh
          echo "$GITHUB_WORKSPACE/.bun/linux-x64" >> "$GITHUB_PATH"
          (cd DbDataKit/web && npm ci --ignore-scripts)
          echo "DBDATA_REQUIRE_BUN=true" >> "$GITHUB_ENV"
          echo "DBDATA_REQUIRE_APP_STORE=true" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: dotnet build DbDataGateway.slnf -c Release
      - name: Test
        shell: bash
        run: |
          # the failed tests are named again at the end: between them the hosts' own log lines run to thousands of lines
          set +e
          dotnet test --project tests/DbDataGateway.Tests -c Release --no-build --minimum-expected-tests 100 2>&1 | tee gateway-tests.log
          code=${PIPESTATUS[0]}
          echo '--- failed tests ---'
          grep -A6 'failed DbDataGateway' gateway-tests.log || true
          exit $code
      - name: Stop the shared engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down

  # The shared Flight SQL client (DbDataKit.Connections.FlightSql) against a real `dbdatagateway server` in front of SQL Server and DuckDB: queries, every
  # compression, prepared and inline parameters, login failures, and the read-only checks. The script builds and starts the gateway; see its header.
  flightsql-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataGateway
          global-json: DbDataGateway/global.json
      - name: Start SQL Server (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up mssql
      - name: Point the script at it
        working-directory: .
        run: testenv/testenv.sh env dbdatakit --dotenv >> "$GITHUB_ENV"
      - name: Gateway and the shared client, end to end
        working-directory: .
        run: DbDataGateway/tests/interop/run-flightsql-e2e.sh
      - name: Stop the shared engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down
