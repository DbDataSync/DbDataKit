name: DbDataProxy release

# Cut a release by dispatching this against main (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md, "Trunk model"):
#
#   gh workflow run dbdataproxy-release.yml --ref main -f beta=false
#   gh workflow run dbdataproxy-release.yml --ref main -f sha=<an older commit on main>
#
# It releases the newest commit on main, or `sha` (which must be on main), and only if that exact commit has a green "DbDataProxy CI" run.
# It packages the Windows zip, tags the commit dbdataproxy/v<version> and publishes a GitHub Release in THIS repository (zip, SHA256SUMS,
# and the standard install.ps1 / Scoop manifest, bound by .github/actions/publish-dist from DbDataProxy/dist.json). No branch is pushed or merged: a release is a tag and its assets. Built-in GITHUB_TOKEN only.
#
# The version is CalVer, YYYY.M.D.HHmm from the UTC clock, like every product.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main and have a green DbDataProxy CI run.
        type: string
        default: ''

permissions:
  contents: write
  # Reads the CI runs for the commit being released.
  actions: read

defaults:
  run:
    working-directory: DbDataProxy

jobs:
  release:
    runs-on: windows-latest
    # Observed: 3 minutes. The ceiling fails a hung build fast instead of after GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the commit, which must be on main
        shell: bash
        working-directory: .
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dbdataproxy-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit."
            exit 1
          fi
          git fetch origin main
          sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only commits on main are released."
            exit 1
          fi
          echo "releasing $sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          git checkout -q --detach "$sha"

      # A lookup, not a re-run: the run on main is the validation (a rebase merge makes new commits, so a pull request's own run is not theirs).
      - name: Require a green CI run for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=success" \
            --jq '[.workflow_runs[] | select(.name == "DbDataProxy CI")] | length')
          echo "successful CI runs for $SHA: $green"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful DbDataProxy CI run for $SHA. Releasing a commit whose CI has not passed is exactly what this check exists to prevent. Dispatch 'DbDataProxy CI' on main, or pick a commit that has a run."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json

      - name: Compute the version
        id: version
        shell: bash
        env:
          BETA: ${{ inputs.beta }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build/package.ps1 -Version $env:VERSION

      # After the package is built, not before: a tag is a claim that this version shipped, so a failed run leaves nothing to clean up.
      - name: Tag this commit with the released version
        shell: bash
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "dbdataproxy/v$VERSION"
          git push origin "refs/tags/dbdataproxy/v$VERSION"

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # --latest=false: "latest" is one marker for the whole repository, not one per product.
          gh release create "dbdataproxy/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataProxy $VERSION" \
            --notes "DbDataProxy $VERSION, packed from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            artifacts/release/*

      - uses: ./.github/actions/publish-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          product: dbdataproxy
          meta: DbDataProxy/dist.json
          version: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          sums: DbDataProxy/artifacts/release/SHA256SUMS
          sha: ${{ env.SHA }}
