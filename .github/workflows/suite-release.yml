name: Suite release

# One release of the whole suite from one commit (plan 13a, L06): the console's zips, MSI and image, and each product's own release (its zips, MSI and
# install files), which this workflow calls: dbdatabuild-release.yml, dbdatagateway-release.yml, dbdatarunner-release.yml, dbdatastore-release.yml, dbdataworkspace-release.yml and dbdatasync-release.yml. Container images are
# built for every product here and pushed to ghcr.io/<owner>/<product> (dbdatakit, dbdatabuild, dbdatagateway); DbDataSync's own image
# keeps its multi-architecture workflow, dbdatasync-publish-image.yml, and is only built here, to prove the commit makes one.
#
#   gh workflow run suite-release.yml --ref main -f dry_run=true                 build everything, tag and publish nothing
#   gh workflow run suite-release.yml --ref main -f beta=true                    a beta release of every product
#   gh workflow run suite-release.yml --ref <any branch> -f snapshot=true       a snapshot of that branch: no main, CI or conformance guards, no images
#   gh workflow run suite-release.yml --ref main -f sha=<an older commit on main>
#
# A dry run keeps every package on the run (artifacts `release-<product>`) and the last job checks that each holds its zips, its MSI and a SHA256SUMS
# that lists them. The products stay releasable on their own: each *-release.yml still has its own dispatch. One CalVer version, computed by the
# `guard` job from the UTC clock, is handed to every product (their `version` input), so a suite release is one commit and one version string.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish every product as a prerelease (-beta suffix, prerelease flag on the GitHub Releases).
        type: boolean
        default: false
      snapshot:
        description: >-
          Publish as a snapshot: a prerelease (-snapshot.g<sha> suffix) cut from any branch or commit with none of the release guards (not
          on main, no green CI run, no conformance gate). `sha` empty means the commit this run was dispatched against. Not with beta.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main.
        type: string
        default: ''
      dry_run:
        description: Build everything and keep it on the run, but tag nothing and publish nothing (no images are pushed).
        type: boolean
        default: false

permissions:
  contents: write
  # Reads the CI runs for the commit being released, and pushes the images.
  actions: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the commit, which must be on main
        id: pick
        env:
          WANTED: ${{ inputs.sha }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$SNAPSHOT" = "true" ]; then
            # A snapshot is cut from any branch or commit, with none of the release guards: the commit this run was dispatched against, or `sha`.
            sha=$(git rev-parse "${WANTED:-HEAD}^{commit}")
            echo "snapshot of $sha, dispatched against $GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::suite-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit, or -f snapshot=true to cut a snapshot from this branch."
              exit 1
            fi
            git fetch origin main
            sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha is not on main. Only commits on main are released (a snapshot can be cut from anywhere: -f snapshot=true)."
              exit 1
            fi
          fi
          echo "releasing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # The console's own version, and the tag every image of this release carries.
      - name: Compute the version
        id: version
        env:
          BETA: ${{ inputs.beta }}
          SNAPSHOT: ${{ inputs.snapshot }}
          PICKED_SHA: ${{ steps.pick.outputs.sha }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          if [ "$SNAPSHOT" = "true" ]; then
            if [ "$BETA" = "true" ]; then echo "::error::choose beta or snapshot, not both"; exit 1; fi
            version="${version}-snapshot.g${PICKED_SHA:0:7}"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # The console: its zips (framework-dependent, so both platforms build on Linux), its MSI, checksums, the tag and the GitHub Release.
  console:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ needs.guard.outputs.sha }}
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      # A lookup, not a re-run, as in the product releases. A dry run builds whatever is on main.
      - name: Require a green CI run for this exact commit
        if: ${{ !inputs.dry_run && !inputs.snapshot }}
        run: |
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=success" \
            --jq '[.workflow_runs[] | select(.name == "DbDataKit CI")] | length')
          echo "successful DbDataKit CI runs for $SHA: $green"
          [ "$green" -ge 1 ] || { echo "::error::No successful DbDataKit CI run for $SHA."; exit 1; }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataKit/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the web app
        working-directory: Shared/web
        run: |
          npm ci
          npm run build -w @dbdatakit/console
      - name: Package win-x64 and linux-x64
        run: |
          for rid in win-x64 linux-x64; do
            SKIP_WEB=1 DbDataKit/scripts/package.sh "$rid" "$VERSION" "$PWD/assets"
          done
      - name: Smoke test the linux-x64 zip
        run: |
          mkdir "$RUNNER_TEMP/zip-smoke"
          unzip -q "assets/dbdatakit-v$VERSION-linux-x64.zip" -d "$RUNNER_TEMP/zip-smoke"
          test -f "$RUNNER_TEMP/zip-smoke/wwwroot/index.html"
          "$RUNNER_TEMP/zip-smoke/dbdatakit" help | grep -q 'Usage: dbdatakit'
      - uses: ./.github/actions/build-msi
        with:
          product: dbdatakit
          meta: DbDataKit/dist.json
          version: ${{ env.VERSION }}
          zip: assets/dbdatakit-v${{ env.VERSION }}-win-x64.zip
          out: assets
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dry_run }}
        with:
          name: release-dbdatakit
          path: assets/*
          if-no-files-found: error
      - name: Tag this commit with the released version
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "dbdatakit/v$VERSION" "$SHA"
          git push origin "refs/tags/dbdatakit/v$VERSION"
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          gh release create "dbdatakit/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "dbdatakit console $VERSION" \
            --notes "The dbdatakit console $VERSION, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. The zips need the .NET 10 runtime. The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            assets/*
      - uses: ./.github/actions/publish-dist
        if: ${{ !inputs.dry_run }}
        with:
          product: dbdatakit
          meta: DbDataKit/dist.json
          version: ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          sums: assets/SHA256SUMS
          sha: ${{ env.SHA }}
          msi: assets/dbdatakit-v${{ env.VERSION }}-win-x64.msi

  # Each product's own release, on the same commit.
  build:
    needs: guard
    uses: ./.github/workflows/dbdatabuild-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read
  gateway:
    needs: guard
    uses: ./.github/workflows/dbdatagateway-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read
  runner:
    needs: guard
    uses: ./.github/workflows/dbdatarunner-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read
  store:
    needs: guard
    uses: ./.github/workflows/dbdatastore-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read
  workspace:
    needs: guard
    uses: ./.github/workflows/dbdataworkspace-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read
  sync:
    needs: guard
    uses: ./.github/workflows/dbdatasync-release.yml
    with:
      sha: ${{ needs.guard.outputs.sha }}
      beta: ${{ inputs.beta }}
      snapshot: ${{ inputs.snapshot }}
      version: ${{ needs.guard.outputs.version }}
      dry_run: ${{ inputs.dry_run }}
    permissions:
      contents: write
      actions: read

  # An image per product, built from the released commit. Pushed (a stable release also moves `latest`) unless this is a dry run; DbDataSync's is built
  # and not pushed, because dbdatasync-publish-image.yml makes its multi-architecture image from the tag.
  images:
    needs: guard
    # A snapshot builds no container images: they are for releases people deploy.
    if: ${{ !inputs.snapshot }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: dbdatakit,   dockerfile: DbDataKit/Dockerfile, health: true,  push: true }
          - { image: dbdatabuild, dockerfile: DbDataBuild/Dockerfile,   health: true,  push: true }
          - { image: dbdatagateway, dockerfile: DbDataGateway/Dockerfile,   health: false, push: true }
          - { image: dbdatasync,  dockerfile: DbDataSync/Dockerfile,    health: false, push: false }
    name: image (${{ matrix.image }})
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      # a commit from before the action existed is built as it was (no action, Dockerfiles that download)
      - if: ${{ hashFiles('.github/actions/duckdb-cache/action.yml') != '' }}
        uses: ./.github/actions/duckdb-cache
        with:
          rids: linux-x64
      - if: ${{ hashFiles('.github/actions/native-cache/action.yml') != '' }}
        uses: ./.github/actions/native-cache
        with:
          rids: linux-x64
      - name: Build
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}:release" .
      # The container must come up healthy before it is pushed (the products whose container needs configuration to start are only built).
      - name: Health check
        if: ${{ matrix.health }}
        run: |
          docker run -d --name img "${{ matrix.image }}:release"
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' img)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs img
          [ "$status" = healthy ] || { echo "::error::the container is $status, not healthy"; exit 1; }
      - name: Push
        if: ${{ matrix.push && !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/$owner/${{ matrix.image }}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "${{ matrix.image }}:release" "$ref:$VERSION"
          docker push "$ref:$VERSION"
          if [ "$PRERELEASE" != "true" ]; then
            docker tag "${{ matrix.image }}:release" "$ref:latest"
            docker push "$ref:latest"
          fi

  # The dry run's answer: every product kept its package, and its checksums list what is in it.
  suite-manifest:
    # The one Scoop manifest for every member (plan 33 section 6a, SC11); it pins each member's zip and hash, so it needs every member's release to exist.
    if: ${{ !inputs.dry_run }}
    needs: [guard, console, build, gateway, runner, store, workspace, sync]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: ./.github/actions/publish-suite-dist
        with:
          version: ${{ needs.guard.outputs.version }}
          prerelease: ${{ needs.guard.outputs.prerelease }}
          sha: ${{ needs.guard.outputs.sha }}

  verify:
    # The images job is skipped for a snapshot, so this cannot rely on the default (every need succeeded).
    if: ${{ inputs.dry_run && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [console, build, gateway, runner, store, workspace, sync, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
      - name: Every artifact has its checksum
        run: |
          set -euo pipefail
          for product in dbdatakit dbdatabuild dbdatagateway dbdatarunner dbdatastore dbdataworkspace dbdatasync; do
            dir="release/release-$product"
            sums="$dir/SHA256SUMS"
            [ -f "$sums" ] || { echo "::error::$product has no SHA256SUMS"; exit 1; }
            (cd "$dir" && sha256sum --check SHA256SUMS)
            for want in '-win-x64.zip' '-win-x64.msi'; do
              ls "$dir"/*"$want" > /dev/null || { echo "::error::$product has no *$want"; exit 1; }
              grep -q -- "$want" "$sums" || { echo "::error::$product's SHA256SUMS does not list *$want"; exit 1; }
            done
            # the products that also ship a Linux zip (plan 33 SC01)
            case "$product" in
              dbdatagateway)
                ls "$dir"/*-linux-x64.zip > /dev/null || { echo "::error::$product has no *-linux-x64.zip"; exit 1; }
                grep -q -- '-linux-x64.zip' "$sums" || { echo "::error::$product's SHA256SUMS does not list *-linux-x64.zip"; exit 1; } ;;
            esac
            echo "== $product"; ls -l "$dir"
          done

  suite-install-windows:
    # The whole single-server install on a real Windows machine (plan 33 SC14), from this dry run's packages: Scoop installs the dbdatakit-full manifest, every member's service starts and answers
    # its health check, the console lists each as ready, an update and an uninstall keep their promises (dist/tests/suite-scoop-e2e.ps1). Written without a Windows machine: its first run is its proof.
    if: ${{ inputs.dry_run && !cancelled() && needs.verify.result == 'success' }}
    needs: [guard, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: The .NET 10 runtime for every account (the services do not read the runner's per-user install)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Runtime aspnetcore -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
          # dotnet-install.ps1 is a script, not a program: it throws on failure and leaves $LASTEXITCODE unset, so the check is for the result
          if (-not (Test-Path "$env:ProgramFiles\dotnet\shared\Microsoft.AspNetCore.App")) { throw "the ASP.NET Core runtime was not installed" }
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
      - name: Install, repeat, update and uninstall the suite with Scoop
        shell: pwsh
        run: ./dist/tests/suite-scoop-e2e.ps1 -Packages "$PWD\release" -Version "${{ needs.guard.outputs.version }}"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: suite-install-logs
          path: ${{ runner.temp }}/suite-scoop/logs/*.txt
