name: DbDataKit CI

# The dbdatakit console on the trunk model (docs/releases.md): a pull request into `main` runs this.
# A `changes` job skips the suites when nothing of the console's, of the Shared/ code it builds against, or of the build
# settings changed; the run then still reports success. The shared libraries' own suite is shared-ci.yml, run once, not per product.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatakit-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataKit

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataKit/|Shared/|DbDataBuild/|DbDataSync/|DbDataGateway/|DbDataStore/|DbDataWorkspace/|dist/compose/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdatakit-|_)|actions/setup-product))'

  # The host, its sign-in and its command line run on both systems; the Windows service registration is only exercised here against fakes.
  test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataKit
          global-json: DbDataKit/global.json
      - run: dotnet build DbDataKit.slnf -c Release
      # The host's state tests (ConsoleStateEngineTests, ConsoleActivityTests, the state verbs) run on SQL Server and PostgreSQL; without the engines they skip, 31 of them (docs/ci-lessons.md).
      # Docker is on the Linux runner only.
      - name: Start the test SQL Server and PostgreSQL
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          testenv/testenv.sh up mssql postgres
          testenv/testenv.sh env dbdatakit --dotenv >> "$GITHUB_ENV"
      - run: dotnet test --project tests/DbDataKit.Server.Tests -c Release --no-build --minimum-expected-tests 10

  # The real programs in one run (plan 13a, T12; E05 adds a Sync server): a Build server and a Gateway started from their built output, a console in the test between them. A Build server publishes and updates its own data source on the Gateway, is refused on
  # one made by hand and on extensions.gateway, cannot adopt for itself, and the Gateway's audit names the person and the Build server. The second test (J12) publishes a project's semantic model and queries it, so a SQL Server from testenv/ is up for that job.
  # The fourth (plan 28c E12e) is a Sync replication that really is owned by a runner: a Sync server and a runner (both programs) with the engine as the runtime package, the replication set published with `dbdatasync package publish`,
  # and a continuous and a periodic replication moved to the runner and back, SQL Server to PostgreSQL (and one SQL Server to SQL Server); it needs the PostgreSQL of testenv/ as well, and takes about five minutes.
  servers:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataKit
          global-json: DbDataKit/global.json
      - uses: ./.github/actions/native-cache
      - name: Build a Build server
        working-directory: DbDataBuild
        run: |
          scripts/fetch-native.sh
          dotnet build src/DbDataBuild.Cli -c Debug
      - name: Build a Gateway
        working-directory: DbDataGateway
        run: dotnet build src/DbDataGateway.Server -c Debug
      - name: Build a Sync server
        working-directory: DbDataSync
        run: dotnet build src/DbDataSync.Cli -c Debug   # builds the engine (the TaskRunner) too: the runtime package of the runner story
      - name: Build a runner
        working-directory: DbDataRunner
        run: dotnet build src/DbDataRunner.Server -c Debug
      - run: dotnet build tests/DbDataKit.Server.Servers.Tests -c Debug
      - name: Start the test SQL Server and PostgreSQL
        working-directory: .
        run: |
          testenv/testenv.sh up mssql postgres
          testenv/testenv.sh env dbdatakit --dotenv >> "$GITHUB_ENV"
      - run: dotnet test --project tests/DbDataKit.Server.Servers.Tests -c Debug --no-build --minimum-expected-tests 4

  # The web app in a real browser against a real console: the first-run invitation, a passkey made in a virtual authenticator, signing out and back in with it, the users list,
  # pairing a real Build server, and (M12) the Monitoring page across a Build server that runs a failing schedule, a Sync replication that lags and a Gateway that locked a user out.
  playwright:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A PostgreSQL for the deploy the browser test approves in the console.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataKit
          global-json: DbDataKit/global.json
          # the Build server the browser test pairs with links the pinned DuckDB engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the web app
        working-directory: Shared/web
        run: |
          npm ci
          npm run build -w @dbdatakit/console
      # The shared visuals (plan 19, Y01-Y02): the view schema's validator and the renderer's component tests, on the semantic library's view fixtures. Plain Node, no browser.
      - name: Test the shared visuals
        working-directory: Shared/web
        run: npm test -w @dbdatakit/visuals
      # The Workspace screen's model: names, the create and abandon rules, the history line (plan 22a, GP31). Plain Node.
      - name: Test the Workspace screens
        working-directory: Shared/web
        run: npm test -w @dbdatakit/workspace
      # The Store's reusable controls (plan 19, Z06): field parsing, the client against a fake server, the views as markup. Plain Node.
      - name: Test the Store controls
        working-directory: Shared/web
        run: |
          npm run typecheck -w @dbdatakit/store-ui
          npm test -w @dbdatakit/store-ui
      # The typed client for semantic queries that apps use (plan 22a GP32), against a fake host. Plain Node.
      - name: Test the semantic client
        working-directory: Shared/web
        run: |
          npm run typecheck -w @dbdatakit/semantic-client
          npm test -w @dbdatakit/semantic-client
      # The runtime that draws an app of views only (plan 26, AP25): its logic and parts in plain Node, and the one-script build the Gateway ships (`apps-views`).
      - name: Test and build the views runtime
        working-directory: Shared/web
        run: |
          npm run typecheck -w @dbdatakit/view-app
          npm test -w @dbdatakit/view-app
          npm run build -w @dbdatakit/view-app
      - run: dotnet build DbDataKit.slnf -c Debug
      # A real Build server for the console to pair with (the pairing, the version and the health the console shows are its own).
      - uses: ./.github/actions/native-cache
      - name: Build a Build server
        working-directory: DbDataBuild
        run: |
          scripts/fetch-native.sh
          dotnet build src/DbDataBuild.Cli -c Debug
      # A real Sync server, for the console to host its screens.
      - name: Build a Sync server
        working-directory: DbDataSync
        run: dotnet build src/DbDataSync.Cli -c Debug
      # A real Gateway, with its management listener on.
      - name: Build a Gateway
        working-directory: DbDataGateway
        run: dotnet build src/DbDataGateway.Server -c Debug
      # A real Store, for the apps host story (plan 26, AP05): a sandboxed app reads and writes its tables through the host.
      - name: Build a Store
        working-directory: DbDataStore
        run: dotnet build src/DbDataStore.Server -c Debug
      # A real runner, for the runner story (plan 28a, R19): the console pairs with it, runs and pauses a task and activates a staged package version.
      - name: Build a runner
        working-directory: DbDataRunner
        run: dotnet build src/DbDataRunner.Server -c Debug
      # A real Workspace server, for the workspaces story (plan 22a, GP31): the console pairs with it, makes and abandons a workspace.
      - name: Build a Workspace server
        working-directory: DbDataWorkspace
        run: dotnet build src/DbDataWorkspace.Server -c Debug
      # The app authoring story (plan 22a GP34) builds an app from the template with the pinned Bun, from the package store made out of the web workspace's packages (the `npm ci` above).
      # The workspace publishing story (plan 22a GP35) builds in the Workspace server with the same Bun and store, and allows user namespaces so the bundler runs in a network namespace
      # where the runner lets it; its server is set to `isolation: auto`, so a runner that does not still builds, and the page says "not isolated".
      - name: Fetch the pinned Bun
        working-directory: .
        run: |
          scripts/fetch-bun.sh
          echo "$GITHUB_WORKSPACE/.bun/linux-x64" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install the browser
        working-directory: DbDataKit/tests/DbDataKit.Server.Web.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: DbDataKit/tests/DbDataKit.Server.Web.Tests
        run: npx playwright test
        env:
          DBDATAKIT_TEST_E2E_PG: Host=127.0.0.1;Port=5432;Username=postgres;Password=e2e;Database=warehouse

  # The image the console is delivered as: it builds, becomes healthy, serves its web app, and does not run as root.
  image:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f DbDataKit/Dockerfile -t dbdatakit:ci .
      - name: Start it and wait for its health check
        run: |
          docker run -d --name ddk -p 8480:8480 dbdatakit:ci
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ddk)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs ddk
          [ "$status" = healthy ] || { echo "the container is $status, not healthy" >&2; exit 1; }
      - name: Answer, serve the app, make an invitation
        run: |
          curl -skf https://localhost:8480/version | grep -q '"product":"dbdatakit"'
          curl -skf https://localhost:8480/ | grep -q '<div id="root">'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8480/api/users)" = 401
          docker exec ddk dotnet /app/dbdatakit.dll user invite --email ci@example.invalid --url https://localhost:8480 | grep -q '/invite#'
          test "$(docker exec ddk id -u)" != 0

  # Each compose file of dist/compose starts a product with the console: the product announces itself on the console's private port, waits as pending, and is paired when confirmed (plan 13a, L03).
  compose:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      # the images of Build, Gateway and Sync fetch the DuckDB engine; .duckdb-archives/ is inside their build context
      - uses: ./.github/actions/duckdb-cache
        with:
          rids: linux-x64
      # the Build image also fetches the polyglot library; .native-archives/ is inside its build context
      - uses: ./.github/actions/native-cache
        with:
          rids: linux-x64
      - name: Build server and console
        run: dist/compose/check.sh dist/compose/build.yml dbdatabuild
      - name: Store server and console
        run: dist/compose/check.sh dist/compose/store.yml dbdatastore
      - name: Gateway and console
        run: dist/compose/check.sh dist/compose/gateway.yml dbdatagateway
      - name: Sync server and console
        run: dist/compose/check.sh dist/compose/sync.yml dbdatasync
      - name: The whole suite (docs/quickstart.md)
        run: dist/compose/check.sh dist/compose/quickstart.yml dbdatagateway dbdatasync dbdatabuild dbdatastore
