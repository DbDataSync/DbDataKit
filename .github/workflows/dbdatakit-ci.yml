name: DbDataKit CI

# The shared libraries' own suite (DbDataKit/), run once on Linux and Windows against the shared engines from testenv/, on a pull request
# into `main` and on every push to it that touches the shared code or the test environment. Each product's CI also runs when DbDataKit/
# changes, so a shared change is proven against every product; this is the libraries' own tests, which used to run once per product.
# The job itself is _dbdatakit.yml, which can also be dispatched on its own.

on:
  pull_request:
    branches: [main]
    paths:
      - "DbDataKit/**"
      - "testenv/**"
      - "duckdb.pin"
      - "scripts/fetch-duckdb.*"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/dbdatakit-ci.yml"
      - ".github/workflows/_dbdatakit.yml"
  push:
    branches: [main]
    paths:
      - "DbDataKit/**"
      - "testenv/**"
      - "duckdb.pin"
      - "scripts/fetch-duckdb.*"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/dbdatakit-ci.yml"
      - ".github/workflows/_dbdatakit.yml"
  workflow_dispatch:
    inputs:
      engines:
        description: Start the shared SQL Server and PostgreSQL engines (testenv/) for the live tests.
        type: boolean
        default: true

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatakit-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dbdatakit:
    uses: ./.github/workflows/_dbdatakit.yml
    with:
      # The live tests run against the shared engines every time (a dispatch can still switch them off).
      engines: ${{ github.event_name != 'workflow_dispatch' || inputs.engines }}

  # The semantic layer's conformance fixtures (plan 19, J02) on the shared engines, as a check of their own: the engine seeds a scratch
  # database on SQL Server and PostgreSQL and runs every fixture through it. The tests also run in the job above whenever the engines
  # are up; this one fails by name when the semantic layer breaks and requires both engines instead of skipping.
  semantic-fixtures:
    name: Semantic fixtures (SQL Server, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "DbDataKit/**/*.csproj"
      - name: Start the shared engines (SQL Server, PostgreSQL)
        run: testenv/testenv.sh up mssql postgres
      - name: Point the suite at the engines
        run: |
          testenv/testenv.sh env dbdatakit --dotenv >> "$GITHUB_ENV"
          echo "DBDATA_REQUIRE_SQLSERVER=true" >> "$GITHUB_ENV"
          echo "DBDATA_REQUIRE_POSTGRES=true" >> "$GITHUB_ENV"
      - name: Fetch the pinned DuckDB engine
        run: scripts/fetch-duckdb.sh
      - name: Test
        working-directory: DbDataKit
        run: dotnet test --project tests/DbDataKit.Semantic.Tests
      - name: Stop the shared engines
        if: always()
        run: testenv/testenv.sh down
