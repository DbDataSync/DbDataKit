name: Repository checks

# Rules about the repository as a whole rather than one product: one version of each NuGet package (scripts/check_package_versions.py),
# one solution that lists every project and builds (DbDataKit.slnx, scripts/check_solution.py).

on:
  pull_request:
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.slnf'
      - 'duckdb.pin'
      - '**/*.props'
      - '**/*.targets'
      - 'scripts/**'
      - '.github/workflows/repo-checks.yml'
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.slnf'
      - 'duckdb.pin'
      - '**/*.props'
      - '**/*.targets'
      - 'scripts/**'
      - '.github/workflows/repo-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I -m unittest discover -s scripts/tests -v
      - run: python3 -I scripts/check_package_versions.py

  solution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/check_solution.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Fetch the pinned DuckDB engine (the projects that use it stop the build without it)
        run: scripts/fetch-duckdb.sh
      - run: dotnet build DbDataKit.slnx -c Release

  # The DuckDB pin (duckdb.pin): every platform's archive and library download and match their recorded hashes, and the PowerShell
  # script does the same on Windows, in Windows PowerShell 5.1 and in PowerShell 7.
  duckdb-pin-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/fetch-duckdb.sh all
      - run: scripts/fetch-duckdb.sh all   # the second run finds every library current

  duckdb-pin-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/fetch-duckdb.ps1 all
      - name: PowerShell 7 (a second run finds every library current)
        shell: pwsh
        run: ./scripts/fetch-duckdb.ps1 all
