name: Repository checks

# Rules about the repository as a whole rather than one product: one version of each NuGet package (scripts/check_package_versions.py),
# every job that needs the DuckDB engine reads it from the cache (scripts/check_duckdb_cache.py), and so does every job that needs the Build native library (scripts/check_native_cache.py), one solution that lists every project and builds (DbDataKit.slnx, scripts/check_solution.py), no document or script that uses a retired command name or one that does not exist (scripts/check_docs_commands.py), and a UI coverage matrix (docs/ui-coverage.md) that names every screen file (scripts/check_ui_coverage.py), an editors table (docs/ui-editors.md) with a row for every registered stored format (scripts/check_ui_editors.py), and plans that are not left open after their work is done or linked after they are gone (scripts/check_plans.py), and formats that keep the freeze rule: a frozen format is not edited and a bumped version has its entry in docs/formats.json (scripts/check_formats.py), no environment variable name with a product prefix in any tracked file (scripts/check_env_names.py), and no secret named `dbdatakit:...` (scripts/check_secret_names.py).

on:
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.md'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - '**/*.ps1'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.slnf'
      - 'duckdb.pin'
      - 'DbDataBuild/scripts/polyglot.pin'
      - 'DbDataBuild/scripts/fetch-native.sh'
      - 'chromium.pin'
      - 'fonts.pin'
      - 'licenses/fonts/**'
      - '**/*.props'
      - '**/*.targets'
      - 'scripts/**'
      - 'docs/ui-coverage.md'
      - 'docs/ui-editors.md'
      - 'docs/formats.json'
      - 'docs/plans/**'
      - 'Shared/web/*/src/pages/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile'
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.slnf'
      - 'duckdb.pin'
      - 'DbDataBuild/scripts/polyglot.pin'
      - 'DbDataBuild/scripts/fetch-native.sh'
      - 'chromium.pin'
      - 'fonts.pin'
      - 'licenses/fonts/**'
      - '**/*.props'
      - '**/*.targets'
      - 'scripts/**'
      - 'docs/plans/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I -m unittest discover -s scripts/tests -v
      - run: python3 -I scripts/check_package_versions.py
      - run: python3 -I scripts/check_docs_commands.py
      - run: python3 -I scripts/check_ui_coverage.py
      - run: python3 -I scripts/check_ui_editors.py
      - run: python3 -I scripts/check_plans.py
      - run: python3 -I scripts/check_formats.py
      - run: python3 -I scripts/check_state_migrations.py
      - run: python3 -I scripts/check_duckdb_cache.py
      - run: python3 -I scripts/check_native_cache.py
      - run: python3 -I scripts/check_env_names.py
      - run: python3 -I scripts/check_secret_names.py
      - run: python3 -I scripts/check_default_ports.py
      - run: python3 -I scripts/check_product_name.py

  solution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/check_solution.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/duckdb-cache
      - name: Fetch the pinned DuckDB engine (the projects that use it stop the build without it)
        run: scripts/fetch-duckdb.sh
      - run: dotnet build DbDataKit.slnx -c Release

  # The DuckDB pin (duckdb.pin): every platform's archive and library download and match their recorded hashes, and the PowerShell
  # script does the same on Windows, in Windows PowerShell 5.1 and in PowerShell 7.
  duckdb-pin-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # the archives of every platform, from the Actions cache or downloaded once (with retries) and saved: fetch-duckdb still hash-checks each
      - uses: ./.github/actions/duckdb-cache
        with:
          rids: all
      - run: scripts/fetch-duckdb.sh all
      - run: scripts/fetch-duckdb.sh all   # the second run finds every library current

  duckdb-pin-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/duckdb-cache
        with:
          rids: all
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/fetch-duckdb.ps1 all
      - name: PowerShell 7 (a second run finds every library current)
        shell: pwsh
        run: ./scripts/fetch-duckdb.ps1 all

  # The polyglot pin (DbDataBuild/scripts/polyglot.pin): both platforms' archives download (or come from the cache) and match their recorded hashes,
  # and the library is installed from the cache folder (a file:// base; on Windows that is file:///D:/a/...).
  native-pin-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-cache
        with:
          rids: all
      - run: DbDataBuild/scripts/fetch-native.sh all
      - run: DbDataBuild/scripts/fetch-native.sh all   # the second run finds every library current

  native-pin-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-cache
        with:
          rids: all
      - name: Install from the cache folder (Git Bash)
        shell: bash
        run: DbDataBuild/scripts/fetch-native.sh all

  # The Chromium pin (chromium.pin, plan 32 DBR15a): both platforms' archives and executables download from Chrome for Testing and match their recorded
  # hashes, and the PowerShell script does the same on Windows, in Windows PowerShell 5.1 and in PowerShell 7.
  chromium-pin-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: scripts/fetch-chromium.sh all
      - run: scripts/fetch-chromium.sh all   # the second run finds every browser current
      - name: The pinned browser starts and reports the pinned version
        run: |
          got="$(.chromium/linux-x64/chrome-linux64/chrome --version | sed 's/[[:space:]]*$//')"
          want="Google Chrome for Testing $(grep '^VERSION=' chromium.pin | cut -d= -f2)"
          echo "got:  [$got]"; echo "want: [$want]"
          test "$got" = "$want"

  chromium-pin-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/fetch-chromium.ps1 all
      - name: PowerShell 7 (a second run finds every browser current)
        shell: pwsh
        run: ./scripts/fetch-chromium.ps1 all

  # The font pin (fonts.pin, plan 32 DBR15b): every family's archive, font files and licence text download and match their recorded hashes; the PowerShell script
  # does the same on Windows, in Windows PowerShell 5.1 and in PowerShell 7.
  fonts-pin-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/fetch-fonts.sh all
      - run: scripts/fetch-fonts.sh all   # the second run finds every family current
      - name: Every pinned file is installed, nothing else
        run: test "$(find .fonts -name '*.woff2' | wc -l)" = "$(grep -c '^FILE=' fonts.pin)"

  fonts-pin-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/fetch-fonts.ps1 all
      - name: PowerShell 7 (a second run finds every family current)
        shell: pwsh
        run: ./scripts/fetch-fonts.ps1 all

  # Plan 24a UC07 (QU9): this build against the latest stable release of each product, N and N-1: the compatibility generation of each side and
  # every format of docs/formats.json, read from the release's tag. Needs the tags, so a full checkout. The matrix is the run's summary.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: python3 -I scripts/check_compatibility.py --matrix | tee compatibility-matrix.json
      - if: always()
        run: |
          { echo '### Compatibility matrix (this build against the latest stable release of each product)'; echo '```json'; cat compatibility-matrix.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
