# Deletes the branch of a pull request once it is merged, so branches do not pile up.
# (The repository setting "Automatically delete head branches" does the same; this keeps the rule in the repository where it can be read and does not depend on the setting.)
# It leaves the branch alone when another open pull request is based on it, and never touches a branch of a fork or the default branch.
# When the merged branch is a subject's `work/<slug>`, it also deletes the task branches `backup/<slug>-<n>` of the task ids its commits start with
# (`INSTALLER-3: ...`), when the pull request carried their tip (scripts/backup_branches.py tasks; docs/branch-cleanup.md, "Task branches").
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          stacked="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --state open --json number --jq 'length')"
          if [ "$stacked" != "0" ]; then
            echo "Keeping '$BRANCH': $stacked open pull request(s) are based on it."
            exit 0
          fi
          # A branch that is already gone counts as deleted; any other failure fails the step. After a failed delete GitHub is asked for the
          # branch (a 404 means it is gone), because the delete's error for a branch that is gone has been worded more than one way.
          if err="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --silent 2>&1)"; then
            echo "Deleted '$BRANCH'."
          else
            status="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --include --silent 2>/dev/null | awk 'NR == 1 { print $2 }' || true)"
            if [ "$status" = "404" ]; then
              echo "'$BRANCH' was already deleted."
            else
              echo "Deleting '$BRANCH' failed (asking GitHub for the branch answered ${status:-nothing}): $err" >&2
              exit 1
            fi
          fi

  task-branches:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'work/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Delete the task branches the pull request carried
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet origin "+refs/pull/$NUMBER/head:refs/remotes/origin/pull-head"
          python3 -I scripts/backup_branches.py tasks --base "$BASE_SHA" --head "$HEAD_SHA" --apply
