name: DbDataBuild release

# Cut a release by dispatching this against dbdatabuild/test:
#
#   gh workflow run dbdatabuild-release.yml --ref dbdatabuild/test -f beta=false
#
# Same model as dbdatasync-release.yml and dbdataproxy-release.yml (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md), on the built-in
# GITHUB_TOKEN. It refuses unless dbdatabuild/test has a green CI run and `main` is already an ancestor of it, runs the full conformance
# suite on every engine, builds the single-file executables for linux-x64 and win-x64 and smoke-tests them, tags the commit
# dbdatabuild/v<version>, publishes a GitHub Release in THIS repository (archives and SHA256SUMS), then merges into main and back into
# every <product>/dev through the shared merge-release action.
#
# The version is CalVer, YYYY.M.D.HHmm from the UTC clock, like every product (the old repo's v0.4.x tags are not carried forward).
#
# Stable releases also point the Scoop manifest (DbDataBuild/bucket/dbdatabuild.json) at the new Windows archive. That is a commit on
# dbdatabuild/test made BEFORE the merge, so it travels into main with the release: a commit made on main afterwards would be one no lane
# contains, and `main` would stop being an ancestor of every <product>/test.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release). A prerelease does not touch the Scoop manifest.
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

defaults:
  run:
    working-directory: DbDataBuild

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse to release from anything but dbdatabuild/test
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "dbdatabuild/test" ]; then
            echo "::error::dbdatabuild-release.yml must be dispatched against 'dbdatabuild/test' (got '$GITHUB_REF_NAME'). See docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md."
            exit 1
          fi

      # main moves by MERGE, so it is not an ancestor of every released commit by construction. Requiring it keeps the merge
      # conflict-free: every product's released state, and every shared-code change, must already be in this lane first.
      - name: Require main to be an ancestor of dbdatabuild/test
        shell: bash
        working-directory: .
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::error::main has commits that dbdatabuild/test does not. Another product has released since this lane last synced. Its back-merge into dbdatabuild/dev, and that branch's promotion to dbdatabuild/test, must land first."
            exit 1
          fi

      - name: Require a green CI run for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq '[.workflow_runs[] | select(.name == "DbDataBuild CI")] | length')
          echo "successful CI runs for $GITHUB_SHA: $green"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Releasing a commit whose CI has not passed is exactly what this check exists to prevent."
            exit 1
          fi

      - name: Compute the version
        id: version
        shell: bash
        env:
          BETA: ${{ inputs.beta }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # A release is built only after every conformance group has passed on every engine.
  conformance-full:
    needs: guard
    uses: ./.github/workflows/dbdatabuild-conformance-full.yml

  build:
    needs: [guard, conformance-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, ext: tar.gz }
          - { os: windows-latest, rid: win-x64,   ext: zip }
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataBuild/global.json
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh ${{ matrix.rid }}
      - name: Unit tests
        run: dotnet test tests/DbDataBuild.Tests.Unit -c Release
      - name: Publish
        shell: bash
        run: scripts/publish.sh ${{ matrix.rid }} out
      - name: Smoke test the published executable
        shell: bash
        run: |
          exe=out/dbdatabuild; [ -f out/dbdatabuild.exe ] && exe=out/dbdatabuild.exe
          "$exe" --help > /dev/null
          "$exe" help matrix --format json | grep -q '"ok": true'
      - name: Package
        shell: bash
        run: |
          name="dbdatabuild-v$VERSION-${{ matrix.rid }}"
          mkdir "$name"
          cp out/dbdatabuild* LICENSE THIRD-PARTY-NOTICES.md README.md "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          ls -l "$name.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: DbDataBuild/dbdatabuild-v*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Stable releases only. A commit on dbdatabuild/test (and on dbdatabuild/dev while it has not moved), so it is released with the
      # code it describes and merged into main with it; see the comment at the top of this file.
      - name: Point the Scoop manifest at this release
        id: manifest
        if: ${{ env.PRERELEASE != 'true' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          name = f"dbdatabuild-v{version}-win-x64"
          sums = {l.split()[1]: l.split()[0] for l in open("dist/SHA256SUMS") if l.strip()}
          path = "DbDataBuild/bucket/dbdatabuild.json"
          m = json.load(open(path))
          arch = m["architecture"]["64bit"]
          m["version"] = version
          arch["url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/dbdatabuild/v{version}/{name}.zip"
          arch["hash"] = sums[f"{name}.zip"]
          arch["extract_dir"] = name
          open(path, "w", newline="\n").write(json.dumps(m, indent=4) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DbDataBuild/bucket/dbdatabuild.json
          git commit -m "scoop: dbdatabuild $VERSION [skip ci]"
          git push origin "HEAD:refs/heads/dbdatabuild/test"
          # dev follows while nothing has landed on it since the released commit; if it has moved on, it gets this commit through the merge back.
          git push origin "HEAD:refs/heads/dbdatabuild/dev" || echo "::notice::dbdatabuild/dev has moved on; it gets the manifest commit through the merge back from main."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # After everything is built, not before: a tag is a claim that this version shipped, so a failed run leaves nothing to clean up.
      - name: Tag this commit with the released version
        working-directory: .
        run: |
          git tag "dbdatabuild/v$VERSION"
          git push origin "refs/tags/dbdatabuild/v$VERSION"

      - name: Publish the GitHub Release
        working-directory: .
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # --latest=false: "latest" is one marker for the whole repository, not one per product.
          gh release create "dbdatabuild/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataBuild $VERSION" \
            --notes "DbDataBuild $VERSION, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD). The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            dist/*

      - name: Merge into main and back into every dev branch
        uses: ./.github/actions/merge-release
        with:
          product: dbdatabuild
          version: ${{ env.VERSION }}
          sha: ${{ steps.manifest.outputs.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
