name: DbDataBuild release

# Cut a release by dispatching this against main (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md, "Trunk model"):
#
#   gh workflow run dbdatabuild-release.yml --ref main -f beta=false
#   gh workflow run dbdatabuild-release.yml --ref main -f sha=<an older commit on main>
#
# It releases the newest commit on main, or `sha` (which must be on main). The gate is inside this workflow: the full conformance suite
# on every engine, then the unit suite and a smoke test of each executable, all on that exact commit. It builds the single-file
# executables for linux-x64 and win-x64, tags the commit dbdatabuild/v<version>, and publishes a GitHub Release in THIS repository
# (archives and SHA256SUMS). No branch is pushed or merged: a release is a tag and its assets.
#
# The version is CalVer, YYYY.M.D.HHmm from the UTC clock, like every product (the old repo's v0.4.x tags are not carried forward).
#
# Each release has a Windows installer, dbdatabuild-v<version>-win-x64.msi (dist/msi.py), beside the zips.
# The standard distribution files (dist/README.md) come with every release: install.ps1 and install.sh are attached to it, and a stable
# release also replaces the fixed `dbdatabuild/dist` release, so these URLs never change:
#   scoop install https://github.com/DbDataSync/DbDataKit/releases/download/dbdatabuild/dist/dbdatabuild.json
#   irm https://github.com/DbDataSync/DbDataKit/releases/download/dbdatabuild/dist/install.ps1 | iex
# A prerelease leaves the fixed release alone.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false
  # suite-release.yml calls this (plan 13a, L06), with dry_run for the suite's dry run.
  workflow_call:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: DbDataBuild

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the commit, which must be on main
        id: pick
        shell: bash
        working-directory: .
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dbdatabuild-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit."
            exit 1
          fi
          git fetch origin main
          sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only commits on main are released."
            exit 1
          fi
          echo "releasing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute the version
        id: version
        shell: bash
        env:
          BETA: ${{ inputs.beta }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # A release is built only after every conformance group has passed on every engine, on the commit being released.
  conformance-full:
    needs: guard
    uses: ./.github/workflows/dbdatabuild-conformance-full.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  build:
    needs: [guard, conformance-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh ${{ matrix.rid }}
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh ${{ matrix.rid }}
      - name: Unit tests
        run: dotnet test tests/DbDataBuild.Tests.Unit -c Release
      - name: Publish
        shell: bash
        run: scripts/publish.sh ${{ matrix.rid }} out
      - name: Smoke test the published executable
        shell: bash
        run: |
          exe=out/dbdatabuild; [ -f out/dbdatabuild.exe ] && exe=out/dbdatabuild.exe
          "$exe" --help > /dev/null
          "$exe" help matrix --format json | grep -q '"ok": true'
          # The bundled DuckDB engine loads and is the pinned release: seeding a project writes a DuckDB file, whose header names the engine.
          want=$(sed -n 's/^VERSION=//p' ../duckdb.pin)
          "$exe" project create retail smoke > /dev/null
          (cd smoke && "../$exe" project compile > /dev/null && "../$exe" project seed > /dev/null && grep -aq "v$want" .dbdatabuild/seed.duckdb)
      # The standard package (dist/README.md): files at the zip root, named <product>-v<version>-<rid>.zip.
      - name: Package
        shell: bash
        run: |
          mkdir stage
          cp out/dbdatabuild* LICENSE THIRD-PARTY-NOTICES.md README.md stage/
          zip="$PWD/dbdatabuild-v$VERSION-${{ matrix.rid }}.zip"
          if [ "${{ matrix.rid }}" = win-x64 ]; then (cd stage && 7z a "$zip" . > /dev/null); else (cd stage && zip -qr "$zip" .); fi
          ls -l "$zip"
      - uses: actions/upload-artifact@v7
        with:
          name: dbdatabuild-${{ matrix.rid }}
          path: DbDataBuild/dbdatabuild-v*.zip
          if-no-files-found: error

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.guard.outputs.sha }}
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: dbdatabuild-*
          path: assets
          merge-multiple: true

      # The Windows installer, built from the win-x64 package just downloaded and checksummed with it.
      - uses: ./.github/actions/build-msi
        with:
          product: dbdatabuild
          meta: DbDataBuild/dist.json
          version: ${{ env.VERSION }}
          zip: assets/dbdatabuild-v${{ env.VERSION }}-win-x64.zip
          out: assets

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # A dry run (suite-release.yml) keeps the files on the run instead of publishing them.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dry_run }}
        with:
          name: release-dbdatabuild
          path: assets/*
          if-no-files-found: error

      # After everything is built, not before: a tag is a claim that this version shipped, so a failed run leaves nothing to clean up.
      - name: Tag the released commit
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          git tag "dbdatabuild/v$VERSION" "$SHA"
          git push origin "refs/tags/dbdatabuild/v$VERSION"

      - name: Publish the GitHub Release
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # --latest=false: "latest" is one marker for the whole repository, not one per product.
          gh release create "dbdatabuild/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataBuild $VERSION" \
            --notes "DbDataBuild $VERSION, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            assets/*

      - uses: ./.github/actions/publish-dist
        if: ${{ !inputs.dry_run }}
        with:
          product: dbdatabuild
          meta: DbDataBuild/dist.json
          version: ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          sums: assets/SHA256SUMS
          sha: ${{ env.SHA }}
          msi: assets/dbdatabuild-v${{ env.VERSION }}-win-x64.msi
