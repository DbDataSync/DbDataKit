name: DbDataBuild release

# Cut a release by dispatching this against main (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md, "Trunk model"):
#
#   gh workflow run dbdatabuild-release.yml --ref main -f beta=false
#   gh workflow run dbdatabuild-release.yml --ref main -f sha=<an older commit on main>
#
# It releases the newest commit on main, or `sha` (which must be on main). The gate is inside this workflow: the full conformance suite
# on every engine, then the unit suite and a smoke test of each executable, all on that exact commit. It builds the single-file
# executables for linux-x64 and win-x64, tags the commit dbdatabuild/v<version>, and publishes a GitHub Release in THIS repository
# (archives and SHA256SUMS). No branch is pushed or merged: a release is a tag and its assets.
#
# The version is CalVer, YYYY.M.D.HHmm from the UTC clock, like every product (the old repo's v0.4.x tags are not carried forward).
#
# A stable release also publishes the Scoop manifest, filled in from DbDataBuild/bucket/dbdatabuild.json, as the asset of one fixed
# release, `dbdatabuild/scoop`, replaced each time, so its URL never changes:
#   scoop install https://github.com/DbDataSync/DbDataKit/releases/download/dbdatabuild/scoop/dbdatabuild.json
# Scoop re-reads that URL on `scoop update`. A prerelease leaves it alone.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release). A prerelease does not touch the Scoop manifest.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main.
        type: string
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: DbDataBuild

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the commit, which must be on main
        id: pick
        shell: bash
        working-directory: .
        env:
          WANTED: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dbdatabuild-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit."
            exit 1
          fi
          git fetch origin main
          sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only commits on main are released."
            exit 1
          fi
          echo "releasing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute the version
        id: version
        shell: bash
        env:
          BETA: ${{ inputs.beta }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # A release is built only after every conformance group has passed on every engine, on the commit being released.
  conformance-full:
    needs: guard
    uses: ./.github/workflows/dbdatabuild-conformance-full.yml
    with:
      ref: ${{ needs.guard.outputs.sha }}

  build:
    needs: [guard, conformance-full]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, ext: tar.gz }
          - { os: windows-latest, rid: win-x64,   ext: zip }
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataBuild/global.json
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh ${{ matrix.rid }}
      - name: Unit tests
        run: dotnet test tests/DbDataBuild.Tests.Unit -c Release
      - name: Publish
        shell: bash
        run: scripts/publish.sh ${{ matrix.rid }} out
      - name: Smoke test the published executable
        shell: bash
        run: |
          exe=out/dbdatabuild; [ -f out/dbdatabuild.exe ] && exe=out/dbdatabuild.exe
          "$exe" --help > /dev/null
          "$exe" help matrix --format json | grep -q '"ok": true'
      - name: Package
        shell: bash
        run: |
          name="dbdatabuild-v$VERSION-${{ matrix.rid }}"
          mkdir "$name"
          cp out/dbdatabuild* LICENSE THIRD-PARTY-NOTICES.md README.md "$name"/
          if [ "${{ matrix.ext }}" = zip ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          ls -l "$name.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: DbDataBuild/dbdatabuild-v*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.guard.outputs.sha }}
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # After everything is built, not before: a tag is a claim that this version shipped, so a failed run leaves nothing to clean up.
      - name: Tag the released commit
        working-directory: .
        run: |
          git tag "dbdatabuild/v$VERSION" "$SHA"
          git push origin "refs/tags/dbdatabuild/v$VERSION"

      - name: Publish the GitHub Release
        working-directory: .
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # --latest=false: "latest" is one marker for the whole repository, not one per product.
          gh release create "dbdatabuild/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataBuild $VERSION" \
            --notes "DbDataBuild $VERSION, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            dist/*

      - name: Publish the Scoop manifest (stable releases only)
        if: ${{ env.PRERELEASE != 'true' }}
        working-directory: .
        run: |
          mkdir scoop
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          name = f"dbdatabuild-v{version}-win-x64"
          sums = {l.split()[1]: l.split()[0] for l in open("dist/SHA256SUMS") if l.strip()}
          m = json.load(open("DbDataBuild/bucket/dbdatabuild.json"))
          m.pop("##", None)
          arch = m["architecture"]["64bit"]
          m["version"] = version
          arch["url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/dbdatabuild/v{version}/{name}.zip"
          arch["hash"] = sums[f"{name}.zip"]
          arch["extract_dir"] = name
          open("scoop/dbdatabuild.json", "w", newline="\n").write(json.dumps(m, indent=4) + "\n")
          PY
          cat scoop/dbdatabuild.json
          # One fixed release whose asset is replaced, so the manifest URL is stable. A prerelease keeps it out of the way of the real ones.
          if ! gh release view dbdatabuild/scoop > /dev/null 2>&1; then
            gh release create dbdatabuild/scoop --target "$SHA" --prerelease --latest=false \
              --title "DbDataBuild Scoop manifest" \
              --notes "The Scoop manifest for the newest stable DbDataBuild release, replaced by each one. Install: scoop install $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dbdatabuild/scoop/dbdatabuild.json"
          fi
          gh release upload dbdatabuild/scoop scoop/dbdatabuild.json --clobber
