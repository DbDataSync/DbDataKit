name: DbDataSync CI

# DbDataSync on the trunk model (docs/releases.md): short feature branches, a pull request
# into `main` that runs this, and a rebase merge. There is no dev/test lane and nothing here moves a branch. A rebase merge makes new
# commits, so the run on `main` is the one that validates what landed, and it is what dbdatasync-release.yml looks for.
#
# Ported from .github/workflows/ci.yml as of DbDataSync/DbDataSync@f1d76ee (kept in this repo's history), whose own comments explain most
# of the decisions here. Every step runs inside DbDataSync/ (defaults.run.working-directory, and explicit paths for actions).
#
# A `changes` job skips the suites when nothing of DbDataSync's, or of the Shared/ code it builds against, changed; the run then
# still reports success. The shared libraries' own suite is shared-ci.yml, run once, not per product.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatasync-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataSync

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataSync/|DbDataKit/|Shared/|testenv/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdatasync-|_)|actions/setup-product))'

  # ---- ported jobs ----
  dotnet:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataSync
      - name: Restore
        run: dotnet restore DbDataSync.slnf
      - name: Build
        run: dotnet build DbDataSync.slnf --no-restore --configuration Release
      - name: Test
        # Category=Integration tests need real database instances (SQL Server, Postgres, MySQL,
        # MariaDB, Oracle) — see the dotnet-integration job below, which brings up the shared engines
        # from testenv/ (architecture/implementation/done/phase-007-e2e-validation.md, extended by phases
        # 153/154).
        run: dotnet test DbDataSync.slnf --no-build --configuration Release --filter "Category!=Integration"

  # A real windows-latest runner for the `[WindowsOnlyFact]`-gated tests of the solution (real icacls,
  # real DPAPI-backed key storage and the like; the service, certificate and Event Log tests went with the
  # Sync server, plan 33 SC23) —
  # every one of those reports [SKIP] on the `dotnet` job above, by design (`WindowsOnlyFactAttribute`),
  # so this is the only place any of them actually run and prove anything. Mirrors the `dotnet` job
  # exactly (same restore/build/test flow, same `Category!=Integration` filter — the DB-backed
  # integration suite needs the Linux-only containers `dotnet-integration` brings up via
  # testenv/, which have no equivalent here) rather than hand-picking which projects to run:
  # any future Windows-only test anywhere in the solution is covered automatically, with no second list
  # to keep in sync.
  dotnet-windows:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataSync
      - name: Restore
        run: dotnet restore DbDataSync.slnf
      - name: Build
        run: dotnet build DbDataSync.slnf --no-restore --configuration Release
      - name: Test
        # Plain `--logger trx`, deliberately without LogFileName: `dotnet test` on the solution runs each
        # test project separately, and a fixed name makes every one of them overwrite the last — the
        # first version of this step shipped that way and its artifact held one project's 207 results out
        # of the suite's ~1,500. The default name is per-project and timestamped, so they coexist.
        run: dotnet test DbDataSync.slnf --no-build --configuration Release --filter "Category!=Integration" --logger trx --results-directory TestResults
      # The Windows-only tests — real Event Log write/read-back, the real icacls ownership transfer —
      # report what they actually observed now rather than asserting a bare boolean. But `dotnet test`'s
      # console reporter prints a *passing* test's captured output nowhere, which is precisely why this
      # repo could never state, after a green windows-latest run, that the Event Log text those tests
      # assert had been read by anybody (see
      # architecture/planning/todo/follow-up-phase-136-140-windows-service-event-log-output-never-read-by-a-human.md).
      # A .trx carries each test's own output including passing ones — verified against a real run, not
      # assumed — so the record exists whether this job is red or green. Always, like the playwright
      # job's own report below and for the same reason: read-on-failure only is what made this a gap.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-windows-trx
          path: DbDataSync/TestResults/
          retention-days: 7

  # Phase 154, then F15: the shared test engines (testenv/docker-compose.yml, the file every product and a developer uses) rather than a
  # second, hand-maintained set of GitHub Actions `services:` container definitions or a compose file of Sync's own. That duplication is
  # what let phase 147/148's mariadb/oracle containers go missing from CI in the first place (phase 153's own retrospective) — one
  # topology, defined once, used everywhere, closes that class of drift for good.
  dotnet-integration:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataSync
          duckdb: 'false'
      - name: Start the databases
        # Every engine Sync's suites use: both SQL Servers (the first with Agent on, for CDC), the PostgreSQL with logical decoding
        # (built from testenv/postgres-logical, with a fresh postgres:17 base), MySQL, MariaDB, Oracle. `up` waits on each one's own
        # healthcheck, so the suite never opens a connection too early. Oracle's init scripts (testenv/oracle-init: the flashback
        # grants and the probe table) run on its first start; this step runs after checkout, so those files exist on disk by then.
        working-directory: .
        run: testenv/testenv.sh up mssql mssql-target postgres-logical mysql mariadb oracle
      - name: Point the suites at them
        working-directory: .
        run: testenv/testenv.sh env dbdatasync --dotenv >> "$GITHUB_ENV"
      - uses: ./.github/actions/duckdb-cache
      - name: Fetch the pinned DuckDB engine
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - name: Restore
        run: dotnet restore DbDataSync.slnf
      - name: Build
        run: dotnet build DbDataSync.slnf --no-restore --configuration Release
      - name: Test (Integration)
        # The engines from testenv/ (SQL Server 14330 and 14331, PostgreSQL with logical decoding 15433, MySQL 13306,
        # MariaDB 13307, Oracle 15210); the DBDATAKIT_TEST_* variables of the step above say where.
        run: dotnet test DbDataSync.slnf --no-build --configuration Release --filter "Category=Integration"
        env:
          # The DuckDB extension test downloads httpfs for the pinned engine from DuckDB's extension server (K06).
          DBDATAKIT_TEST_NETWORK: "true"
      - name: Stop the databases
        if: always()
        working-directory: .
        run: testenv/testenv.sh down

  web:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Shared/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Shared/web/package-lock.json
      - name: Install
        run: npm ci
      # Phase 160: the renderer's tests — what markup a document may and may not produce. Plain Node, no browser. (The Sync screens, @dbdatakit/sync,
      # and their Playwright suite went with the Sync server, plan 33 SC23.)
      - name: Test
        run: |
          npm test -w @dbdatakit/shell
          npm test -w @dbdatakit/admin
