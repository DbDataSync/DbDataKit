name: DbDataConsole CI

# The dbdatakit console on the trunk model (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md): a pull request into `main` runs this.
# A `changes` job skips the suites when nothing of the console's, of the shared DbDataKit/ code it builds against, or of the build
# settings changed; the run then still reports success. The shared libraries' own suite is dbdatakit-ci.yml, run once, not per product.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdataconsole-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataConsole

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataConsole/|DbDataKit/|DbDataBuild/|DbDataSync/|DbDataProxy/|DbDataStore/|dist/compose/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdataconsole-|_)|actions/setup-product))'

  # The host, its sign-in and its command line run on both systems; the Windows service registration is only exercised here against fakes.
  test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataConsole
          global-json: DbDataConsole/global.json
      - run: dotnet build DbDataConsole.slnf -c Release
      - run: dotnet test --project tests/DbDataConsole.Tests -c Release --no-build --minimum-expected-tests 10

  # The real programs in one run (plan 13a, T12): a Build server and a Proxy started from their built output, a console in the test between them. A Build server publishes and updates its own data source on the Proxy, is refused on
  # one made by hand and on extensions.proxy, cannot adopt for itself, and the Proxy's audit names the person and the Build server. The second test (J12) publishes a project's semantic model and queries it, so a SQL Server from testenv/ is up for that job.
  servers:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataConsole
          global-json: DbDataConsole/global.json
      - name: Build a Build server
        working-directory: DbDataBuild
        run: |
          scripts/fetch-native.sh
          dotnet build src/DbDataBuild.Cli -c Debug
      - name: Build a Proxy
        working-directory: DbDataProxy
        run: dotnet build src/DbDataProxy.Server -c Debug
      - run: dotnet build tests/DbDataConsole.Servers.Tests -c Debug
      - name: Start the test SQL Server
        working-directory: .
        run: |
          testenv/testenv.sh up mssql
          testenv/testenv.sh env dbdatakit --dotenv >> "$GITHUB_ENV"
      - run: dotnet test --project tests/DbDataConsole.Servers.Tests -c Debug --no-build --minimum-expected-tests 2

  # The web app in a real browser against a real console: the first-run invitation, a passkey made in a virtual authenticator, signing out and back in with it, the users list,
  # pairing a real Build server, and (M12) the Monitoring page across a Build server that runs a failing schedule, a Sync replication that lags and a Proxy that locked a user out.
  playwright:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A PostgreSQL for the deploy the browser test approves in the console.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataConsole
          global-json: DbDataConsole/global.json
          # the Build server the browser test pairs with links the pinned DuckDB engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the web app
        working-directory: DbDataKit/web
        run: |
          npm ci
          npm run build -w @dbdatakit/console
      # The shared visuals (plan 19, Y01-Y02): the view schema's validator and the renderer's component tests, on the semantic library's view fixtures. Plain Node, no browser.
      - name: Test the shared visuals
        working-directory: DbDataKit/web
        run: npm test -w @dbdatakit/visuals
      - run: dotnet build DbDataConsole.slnf -c Debug
      # A real Build server for the console to pair with (the pairing, the version and the health the console shows are its own).
      - name: Build a Build server
        working-directory: DbDataBuild
        run: |
          scripts/fetch-native.sh
          dotnet build src/DbDataBuild.Cli -c Debug
      # A real Sync server, for the console to host its screens.
      - name: Build a Sync server
        working-directory: DbDataSync
        run: dotnet build src/DbDataSync.Cli -c Debug
      # A real Proxy, with its management listener on.
      - name: Build a Proxy
        working-directory: DbDataProxy
        run: dotnet build src/DbDataProxy.Server -c Debug
      - name: Install the browser
        working-directory: DbDataConsole/tests/DbDataConsole.Web.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: DbDataConsole/tests/DbDataConsole.Web.Tests
        run: npx playwright test
        env:
          DBDATA_E2E_PG: Host=127.0.0.1;Port=5432;Username=postgres;Password=e2e;Database=warehouse

  # The image the console is delivered as: it builds, becomes healthy, serves its web app, and does not run as root.
  image:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f DbDataConsole/Dockerfile -t dbdatakit:ci .
      - name: Start it and wait for its health check
        run: |
          docker run -d --name ddk -p 8480:8480 dbdatakit:ci
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ddk)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs ddk
          [ "$status" = healthy ] || { echo "the container is $status, not healthy" >&2; exit 1; }
      - name: Answer, serve the app, make an invitation
        run: |
          curl -skf https://localhost:8480/version | grep -q '"product":"dbdatakit"'
          curl -skf https://localhost:8480/ | grep -q '<div id="root">'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8480/api/users)" = 401
          docker exec ddk dotnet /app/dbdatakit.dll user invite --url https://localhost:8480 | grep -q '/invite#'
          test "$(docker exec ddk id -u)" != 0

  # Each compose file of dist/compose starts a product with the console: the product announces itself on the console's private port, waits as pending, and is paired when confirmed (plan 13a, L03).
  compose:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Build server and console
        run: dist/compose/check.sh dist/compose/build.yml dbdatabuild
      - name: Store server and console
        run: dist/compose/check.sh dist/compose/store.yml dbdatastore
      - name: Proxy and console
        run: dist/compose/check.sh dist/compose/proxy.yml dbdataproxy
      - name: Sync server and console
        run: dist/compose/check.sh dist/compose/sync.yml dbdatasync
