name: Installer (MSI) CI

# Builds each product's MSI with wixl from its newest published package, on Ubuntu, then installs, upgrades and removes it on a real Windows
# machine (dist/tests/msi-e2e.ps1). Two MSIs are built per product, the second newer and carrying an extra file, to test the upgrade.

on:
  pull_request:
    paths:
      - 'dist/msi.py'
      - 'dist/tests/**'
      - 'DbDataConsole/scripts/**'
      - '**/dist.json'
      - '.github/workflows/dist-msi-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-msi-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -y && sudo apt-get install -y wixl msitools
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataConsole/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build two MSIs per product from the newest published package
        run: |
          set -euo pipefail
          declare -A META=( [dbdataproxy]=DbDataProxy [dbdatasync]=DbDataSync [dbdatabuild]=DbDataBuild [dbdatakit]=DbDataConsole )
          # The console has no published release before its first one, so its package is built here from this commit.
          mkdir -p work/dbdatakit out/dbdatakit
          DbDataConsole/scripts/package.sh win-x64 2026.1.1.0 "$PWD/work/dbdatakit"
          for product in dbdataproxy dbdatasync dbdatabuild dbdatakit; do
            work="work/$product"; mkdir -p "$work" "out/$product"
            if [ "$product" = dbdatakit ]; then
              unzip -q "$work/dbdatakit-v2026.1.1.0-win-x64.zip" -d "$work/payload"
            else
              tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq "[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith(\"$product/v\")))][0].tag_name")
              version=${tag#"$product"/v}
              echo "$product: $version"
              gh release download "$tag" --pattern "$product-v$version-win-x64.zip" --dir "$work"
              unzip -q "$work/$product-v$version-win-x64.zip" -d "$work/payload"
            fi
            # Transitional (plan 13, C03): Proxy's executable is lower case from now on, and the newest published package still has the old
            # file name. Rename it in the unpacked copy so the MSI is built from dist.json as it is now; delete this once a release has the new name.
            # retired-name-ok: the old file name is what the newest published package still has
            if [ "$product" = dbdataproxy ] && [ -f "$work/payload/DbDataProxy.exe" ] && [ ! -f "$work/payload/dbdataproxy.exe" ]; then
              # retired-name-ok
              mv "$work/payload/DbDataProxy.exe" "$work/payload/dbdataproxy.exe"
            fi
            python3 dist/msi.py build --meta "${META[$product]}/dist.json" --version 2026.1.1.0 --payload "$work/payload" --out "out/$product/v1.msi"
            cp -r "$work/payload" "$work/payload2"
            echo "upgraded" > "$work/payload2/UPGRADED.txt"
            python3 dist/msi.py build --meta "${META[$product]}/dist.json" --version 2026.1.2.0 --payload "$work/payload2" --out "out/$product/v2.msi"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: out
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { product: dbdataproxy, display: DbDataProxy, exe: dbdataproxy.exe, service: dbdataproxy, runs: true,  path: false }
          - { product: dbdatasync,  display: DbDataSync,  exe: dbdatasync.exe,  service: DbDataSync,  runs: false, path: true }
          - { product: dbdatabuild, display: DbDataBuild, exe: dbdatabuild.exe, service: '',          runs: false, path: true }
          - { product: dbdatakit,   display: DbDataKit,   exe: dbdatakit.exe,   service: DbDataKitConsole, runs: false, path: false }
    name: windows (${{ matrix.product }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.product == 'dbdatasync' || matrix.product == 'dbdatakit'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: msi
      - name: Install, upgrade and remove ${{ matrix.display }}
        shell: pwsh
        run: |
          $args = @{
            Msi1 = "$PWD\msi\${{ matrix.product }}\v1.msi"
            Msi2 = "$PWD\msi\${{ matrix.product }}\v2.msi"
            DisplayName = '${{ matrix.display }}'
            Exe = '${{ matrix.exe }}'
            LogDir = $env:RUNNER_TEMP
          }
          if ('${{ matrix.service }}') { $args.ServiceName = '${{ matrix.service }}' }
          if ('${{ matrix.runs }}' -eq 'true') { $args.ServiceRuns = $true }
          if ('${{ matrix.path }}' -eq 'true') { $args.OnPath = $true }
          ./dist/tests/msi-e2e.ps1 @args
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: msi-logs-${{ matrix.product }}
          path: ${{ runner.temp }}/*.log

  
  pairing:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library and pinned DuckDB engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd DbDataBuild && scripts/fetch-native.sh)
          scripts/fetch-duckdb.sh
      # The product is built from this commit: the newest published package can predate `server pair`.
      - name: Publish DbDataBuild
        shell: bash
        working-directory: DbDataBuild
        run: scripts/publish.sh win-x64 "$RUNNER_TEMP/build-out"
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: msi
      - name: Install the console and pair DbDataBuild with it
        shell: pwsh
        run: |
          ./dist/tests/msi-pairing-e2e.ps1 -ConsoleMsi "$PWD\msi\dbdatakit\v1.msi" -ProductExe "$env:RUNNER_TEMP\build-out\dbdatabuild.exe"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: msi-logs-pairing
          path: ${{ runner.temp }}/pairing*
