name: DbDataStore CI

# DbDataStore on the trunk model (docs/releases.md): a pull request into `main` runs this.
# A `changes` job skips the suite when nothing of the store's, of the Shared/ code it builds against, or of the build
# settings changed; the run then still reports success. The shared libraries' own suite is shared-ci.yml, run once, not per product.

on:
  # Planning, documentation and Markdown alone start nothing here (scripts/ci_paths.py, PRODUCT_IGNORE): scripts/check_doc_inputs.py in
  # Repository checks reads what the build takes from them. The two lists are the same, so a pull request and its merge agree.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'planning/**'
      - '.claude/**'
      - 'docs/**'
      - '**.md'
      - 'DbDataKit/docs/**'
      - 'DbDataSync/docs/**'
      - 'DbDataBuild/docs/**'
      - 'DbDataGateway/docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'planning/**'
      - '.claude/**'
      - 'docs/**'
      - '**.md'
      - 'DbDataKit/docs/**'
      - 'DbDataSync/docs/**'
      - 'DbDataBuild/docs/**'
      - 'DbDataGateway/docs/**'
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatastore-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataStore

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataStore/|Shared/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdatastore-|_)|actions/setup-product))'

  # The program is the runtime of a model's package (plan 33 SC23 deleted the server): its command line on both systems. The deploy and contract tasks on a real runner and real engines are
  # StoreDeployOnRunnerTests in the console's servers job (dbdatakit-ci.yml).
  test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataStore
          global-json: DbDataStore/global.json
          duckdb: 'false'
      - run: dotnet build DbDataStore.slnf -c Release
      - run: dotnet test --project tests/DbDataStore.Tests -c Release --no-build --minimum-expected-tests 5
