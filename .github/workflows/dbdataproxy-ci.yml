name: DbDataProxy CI

# DbDataProxy's lane of the monorepo: dbdataproxy/dev -> dbdataproxy/test -> main (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md).
# Same shape as dbdatasync-ci.yml: a `changes` job decides whether the suite is needed, the suite runs on Windows and Linux, and
# `promote` (the last job, using the built-in GITHUB_TOKEN) fast-forwards dbdataproxy/test to the commit this run validated.
# A push made with GITHUB_TOKEN starts no workflow, hence workflow_dispatch: the release dispatches this after it merges main back
# into dbdataproxy/dev, and that run's promote job carries the merge to test.

on:
  push:
    branches: [dbdataproxy/dev]
  pull_request:
    branches: [dbdataproxy/dev]
  workflow_dispatch:
    inputs:
      all:
        description: Run every job, including the shared DbDataKit tests, whatever changed.
        type: boolean
        default: false
  # Called by repo-ci.yml (the repo-wide dev -> test lane), which runs every suite whatever changed and runs the shared
  # DbDataKit job itself once. `promote` is skipped there: github.ref is the caller's ref, not dbdataproxy/dev.
  workflow_call:
    inputs:
      all:
        description: Run every job, including the shared DbDataKit tests, whatever changed.
        type: boolean
        default: false
      shared:
        description: Run the shared DbDataKit tests (false when the caller runs them).
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataProxy

jobs:
  # Is there anything here that the suite has not already validated? Compared with dbdataproxy/test, the last promoted commit.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      shared: ${{ steps.diff.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ALL: ${{ inputs.all }}
          SHARED: ${{ inputs.shared }}
        run: |
          if [ "$ALL" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            if [ "$SHARED" = "false" ]; then echo "shared=false" >> "$GITHUB_OUTPUT"; else echo "shared=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/dbdataproxy/test"
          fi
          build=true
          shared=true
          if git rev-parse --verify --quiet "$base" >/dev/null; then
            changed=$(git diff --name-only "$base"...HEAD)
            echo "changed since $base:"; echo "$changed"
            echo "$changed" | grep -qE '^(DbDataProxy/|DbDataKit/|testenv/|\.github/(workflows/(dbdataproxy-|_)|actions/))' || build=false
            echo "$changed" | grep -q '^DbDataKit/' || shared=false
          else
            echo "::notice::$base does not exist yet, so everything is treated as changed."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"

  # DbDataKit/ is changed through the product branches, so a product's CI proves it. One shared job, not a copy per product.
  dbdatakit:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/_dbdatakit.yml

  # The Windows service, DPAPI, ACLs, the 32-bit worker and the text ODBC driver only exist here, so this is the only job that
  # exercises them; it also packages the release zip as a smoke test.
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    # Observed: 3 minutes (the installer tests add a little). The ceiling fails a hung test fast.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100
      - name: Package (smoke test)
        run: ./build/package.ps1 -Version 0.0.0-ci
        shell: pwsh
      # install.ps1 promises to work in Windows PowerShell 5.1, so its release-selection tests run there and in PowerShell 7.
      - name: Installer tests (Windows PowerShell 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/install.tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # Linux against a real SQL Server (the ODBC and SqlClient paths), plus everything that is not Windows-specific. The server is the
  # shared one from testenv/, the same SQL Server the shared libraries' live tests use.
  linux:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Observed: 1.5 minutes. Starting the engine adds a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - name: Test the test-environment scripts
        working-directory: .
        run: testenv/selftest.sh
      - name: Start SQL Server (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up mssql
      - name: Point the suite at it
        working-directory: .
        run: testenv/testenv.sh env dbdataproxy --dotenv >> "$GITHUB_ENV"
      - name: Install the SQL Server ODBC driver
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - run: dotnet build -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100
      - name: Stop the shared engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down

  # dbdataproxy/dev -> dbdataproxy/test, on a green run. Nobody pushes to dbdataproxy/test; this is the only thing that moves it,
  # and it fast-forwards to the exact commit this run validated. Only a run on dbdataproxy/dev itself promotes: a manual run on
  # any other branch (a pull request's, say) is a test run, and must never move test. Skipped suites count as passing: `changes` decided they were
  # not needed.
  promote:
    needs: [changes, dbdatakit, windows, linux]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dbdataproxy/dev' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dbdataproxy-promote
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward dbdataproxy/test to this commit
        working-directory: .
        run: |
          git fetch origin dbdataproxy/test
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dbdataproxy/test; then
            echo "::notice::dbdataproxy/test already contains $GITHUB_SHA — nothing to promote."
          elif git merge-base --is-ancestor origin/dbdataproxy/test "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/dbdataproxy/test"
          else
            echo "::error::dbdataproxy/test has commits dbdataproxy/dev doesn't — refusing to fast-forward over them. It may have been pushed to directly; investigate before retrying."
            exit 1
          fi
