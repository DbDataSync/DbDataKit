name: DbDataProxy CI

# DbDataProxy on the trunk model (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md, "Trunk model"): short feature branches, a pull request
# into `main` that runs this, and a rebase merge. There is no dev/test lane and nothing here moves a branch. A rebase merge makes new
# commits, so the run on `main` is the one that validates what landed, and it is what dbdataproxy-release.yml looks for.
#
# A `changes` job skips the suites when nothing of DbDataProxy's, of the shared DbDataKit/ code it builds against, or of the test
# environment changed; the run then still reports success. The shared libraries' own suite is dbdatakit-ci.yml, run once, not per product.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, whatever changed.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdataproxy-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataProxy

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF"; range="$base...HEAD" ;;
            push)         base="$BEFORE"; range="$BEFORE..HEAD" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            changed=$(git diff --name-only "$range")
            echo "changed in $range:"; echo "$changed"
            echo "$changed" | grep -qE '^(DbDataProxy/|DbDataKit/|testenv/|Directory\.(Build|Packages)\.props|global\.json|\.github/workflows/(dbdataproxy-|_))' || build=false
          else
            echo "::notice::no base to compare with ($EVENT), so everything is treated as changed."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # The Windows service, DPAPI, ACLs, the 32-bit worker and the text ODBC driver only exist here, so this is the only job that
  # exercises them; it also packages the release zip as a smoke test.
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    # Observed: 3 minutes (the installer tests add a little). The ceiling fails a hung test fast.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - run: dotnet build DbDataProxy.slnf -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100
      - name: Package (smoke test)
        run: ./build/package.ps1 -Version 0.0.0-ci
        shell: pwsh

  # Linux against a real SQL Server (the ODBC and SqlClient paths), plus everything that is not Windows-specific. The server is the
  # shared one from testenv/, the same SQL Server the shared libraries' live tests use.
  linux:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Observed: 1.5 minutes. Starting the engine adds a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - name: Test the test-environment scripts
        working-directory: .
        run: testenv/selftest.sh
      - name: Start SQL Server (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up mssql
      - name: Point the suite at it
        working-directory: .
        run: testenv/testenv.sh env dbdataproxy --dotenv >> "$GITHUB_ENV"
      - name: Install the SQL Server ODBC driver
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - run: dotnet build DbDataProxy.slnf -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100
      - name: Stop the shared engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down
