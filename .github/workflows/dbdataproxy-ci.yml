name: DbDataProxy CI

# DbDataProxy's lane of the monorepo: dbdataproxy/dev -> dbdataproxy/test -> main (docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md).
# Same shape as dbdatasync-ci.yml: a `changes` job decides whether the suite is needed, the suite runs on Windows and Linux, and
# `promote` (the last job, using the built-in GITHUB_TOKEN) fast-forwards dbdataproxy/test to the commit this run validated.
# A push made with GITHUB_TOKEN starts no workflow, hence workflow_dispatch: the release dispatches this after it merges main back
# into dbdataproxy/dev, and that run's promote job carries the merge to test.

on:
  push:
    branches: [dbdataproxy/dev]
  pull_request:
    branches: [dbdataproxy/dev]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataProxy

jobs:
  # Is there anything here that the suite has not already validated? Compared with dbdataproxy/test, the last promoted commit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      shared: ${{ steps.diff.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/dbdataproxy/test"
          fi
          build=true
          shared=true
          if git rev-parse --verify --quiet "$base" >/dev/null; then
            changed=$(git diff --name-only "$base"...HEAD)
            echo "changed since $base:"; echo "$changed"
            echo "$changed" | grep -qE '^(DbDataProxy/|DbDataKit/|\.github/(workflows/(dbdataproxy-|_)|actions/))' || build=false
            echo "$changed" | grep -q '^DbDataKit/' || shared=false
          else
            echo "::notice::$base does not exist yet, so everything is treated as changed."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"

  # DbDataKit/ is changed through the product branches, so a product's CI proves it. One shared job, not a copy per product.
  dbdatakit:
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/_dbdatakit.yml

  # The Windows service, DPAPI, ACLs, the 32-bit worker and the text ODBC driver only exist here, so this is the only job that
  # exercises them; it also packages the release zip as a smoke test.
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100
      - name: Package (smoke test)
        run: ./build/package.ps1 -Version 0.0.0-ci
        shell: pwsh

  # Linux against a real SQL Server (the ODBC and SqlClient paths), plus everything that is not Windows-specific.
  linux:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Dbproxy-Ci-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 15s
    env:
      DBPROXY_TEST_SQLSERVER: localhost,1433
      DBPROXY_TEST_SQLSERVER_USER: sa
      DBPROXY_TEST_SQLSERVER_PASSWORD: Dbproxy-Ci-Passw0rd
      DBPROXY_REQUIRE_SQLSERVER: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataProxy/global.json
      - name: Install the SQL Server ODBC driver
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - run: dotnet build -c Release
      - run: dotnet test --project tests/DbDataProxy.Tests -c Release --no-build --minimum-expected-tests 100

  # dbdataproxy/dev -> dbdataproxy/test, on a green run. Nobody pushes to dbdataproxy/test; this is the only thing that moves it,
  # and it fast-forwards to the exact commit this run validated. Skipped suites count as passing: `changes` decided they were
  # not needed.
  promote:
    needs: [changes, dbdatakit, windows, linux]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    concurrency:
      group: dbdataproxy-promote
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward dbdataproxy/test to this commit
        working-directory: .
        run: |
          git fetch origin dbdataproxy/test
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dbdataproxy/test; then
            echo "::notice::dbdataproxy/test already contains $GITHUB_SHA — nothing to promote."
          elif git merge-base --is-ancestor origin/dbdataproxy/test "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/dbdataproxy/test"
          else
            echo "::error::dbdataproxy/test has commits dbdataproxy/dev doesn't — refusing to fast-forward over them. It may have been pushed to directly; investigate before retrying."
            exit 1
          fi
