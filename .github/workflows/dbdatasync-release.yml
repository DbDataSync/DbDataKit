name: DbDataSync release

# Cut a release by dispatching this against main (docs/releases.md):
#
#   gh workflow run dbdatasync-release.yml --ref main -f beta=false
#   gh workflow run dbdatasync-release.yml --ref main -f sha=<an older commit on main>
#
# It releases the newest commit on main, or `sha` (which must be on main), and only if that exact commit has a green "DbDataSync CI" run.
# It builds the standard zip packages, the Windows installer (.msi) and the install scripts (dist/README.md), checks them, tags the commit
# dbdatasync/v<version> and publishes a GitHub Release in THIS repository with them attached. There is no dotnet tool package (owner decision
# 2026-11-08). No branch is pushed or merged: a release is a tag and its assets. Everything runs on the built-in GITHUB_TOKEN; there is no
# container image (dispatch dbdatasync-publish-image.yml by hand) and no GitHub App.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      snapshot:
        description: >-
          Publish as a snapshot: a prerelease (-snapshot.g<sha> suffix) cut from any branch or commit with none of the release guards (not
          on main, no green CI run, no conformance gate). `sha` empty means the commit this run was dispatched against. Not with beta.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main and have a green DbDataSync CI run.
        type: string
        default: ''
      version:
        description: The release version, exactly as it would be tagged (2026.10.30.1415 or 2026.10.30.1415-beta). Empty means the UTC clock now. suite-release.yml passes one so every product of a suite release has the same.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false
  # suite-release.yml calls this (plan 13a, L06), with dry_run for the suite's dry run.
  workflow_call:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      snapshot:
        description: >-
          Publish as a snapshot: a prerelease (-snapshot.g<sha> suffix) cut from any branch or commit with none of the release guards (not
          on main, no green CI run, no conformance gate). `sha` empty means the commit this run was dispatched against. Not with beta.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main and have a green DbDataSync CI run.
        type: string
        default: ''
      version:
        description: The release version, exactly as it would be tagged (2026.10.30.1415 or 2026.10.30.1415-beta). Empty means the UTC clock now. suite-release.yml passes one so every product of a suite release has the same.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false

permissions:
  contents: write
  # Reads the CI runs for the commit being released.
  actions: read

defaults:
  run:
    working-directory: DbDataSync

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit to release is picked below and must be shown to be an ancestor of main, which the default shallow clone cannot do.
          fetch-depth: 0

      - name: Pick the commit, which must be on main
        id: pick
        working-directory: .
        env:
          WANTED: ${{ inputs.sha }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$SNAPSHOT" = "true" ]; then
            # A snapshot is cut from any branch or commit, with none of the release guards: the commit this run was dispatched against, or `sha`.
            sha=$(git rev-parse "${WANTED:-HEAD}^{commit}")
            echo "snapshot of $sha, dispatched against $GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::dbdatasync-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit, or -f snapshot=true to cut a snapshot from this branch."
              exit 1
            fi
            git fetch origin main
            sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha is not on main. Only commits on main are released (a snapshot can be cut from anywhere: -f snapshot=true)."
              exit 1
            fi
          fi
          echo "releasing $sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          git checkout -q --detach "$sha"

      # A lookup, not a re-run: the run on main is the validation (a rebase merge makes new commits, so a pull request's own run is not
      # theirs), and re-running ~15 minutes of suite would only re-derive the answer and give a known-flaky job a veto over releasing.
      # What a re-run would not establish better is what is worth asserting: that a green run for this exact commit exists. That is false
      # for a commit that reached main some other way (a bot push, a skipped run), which is the case this gate is for. Any successful run
      # counts, not merely the newest: a flake that was re-run to green is what a human would have accepted by hand.
      - name: Require a green CI run for this exact commit
        if: ${{ !inputs.dry_run && !inputs.snapshot }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=success" \
            --jq '[.workflow_runs[] | select(.name == "DbDataSync CI")] | length')
          echo "successful CI runs for $SHA: $green"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful DbDataSync CI run for $SHA. Releasing a commit whose CI has not passed is exactly what this check exists to prevent. Dispatch 'DbDataSync CI' on main, or pick a commit that has a run."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The shipped version is computed here, from the clock — not typed by a human anywhere.
      # YYYY.M.D.HHmm in UTC, which is a valid four-part assembly version (every part is well under
      # the 65534 ceiling). Every part is normalized with `$((10#$part))` (no leading zero; 10# forces base 10 rather than
      # bash's octal reading of "09"), so the string is the same everywhere it is used: the tag, the file names and what
      # `dbdatasync version` reports.
      #
      # Whether this is a prerelease is the one thing the operator *does* still choose, via the `beta` checkbox on the manual run
      # (or `-f beta=true`): it appends a `-beta` SemVer 2 prerelease label and sets the prerelease flag on the GitHub Release.
      - name: Compute the version
        id: version
        env:
          BETA: ${{ inputs.beta }}
          SNAPSHOT: ${{ inputs.snapshot }}
          PICKED_SHA: ${{ env.SHA }}
          WANTED_VERSION: ${{ inputs.version }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          if [ "$SNAPSHOT" = "true" ]; then
            if [ "$BETA" = "true" ]; then echo "::error::choose beta or snapshot, not both"; exit 1; fi
            version="${version}-snapshot.g${PICKED_SHA:0:7}"
            prerelease=true
          fi
          # A version handed in (by suite-release.yml) wins over the clock; it must be CalVer, and -beta decides the prerelease flag.
          if [ -n "$WANTED_VERSION" ]; then
            case "$WANTED_VERSION" in
              [0-9][0-9][0-9][0-9].*.*.*) ;;
              *) echo "::error::'$WANTED_VERSION' is not a CalVer version (YYYY.M.D.HHmm[-beta|-snapshot])"; exit 1 ;;
            esac
            version="$WANTED_VERSION"
            case "$version" in *-beta|*-snapshot|*-snapshot.*) prerelease=true ;; *) prerelease=false ;; esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The standard zip packages (dist/README.md): framework-dependent publishes (they need the .NET 10 runtime;
      # self-contained is ruled out, see DbDataSync.Cli.csproj) with the apphost renamed to what dist.json promises. Built before
      # the tag, like everything that must exist for the version to count as shipped. -p:Version is a global MSBuild property, so it
      # overrides the csproj's development default.
      - name: Build the zip packages
        env:
          SHIPPED: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts/dist
          for rid in win-x64 linux-x64; do
            dotnet publish src/DbDataSync.Cli/DbDataSync.Cli.csproj -c Release -r "$rid" --self-contained false \
              -p:Version="$SHIPPED" -p:DebugType=None -o "artifacts/publish/$rid"
            if [ "$rid" = win-x64 ]; then ext=.exe; else ext=; fi
            mv "artifacts/publish/$rid/DbDataSync.Cli$ext" "artifacts/publish/$rid/dbdatasync$ext"
            if [ -d "artifacts/publish/$rid/wwwroot" ]; then
              echo "::error::the $rid package carries a wwwroot: Sync no longer serves a web app"
              exit 1
            fi
            (cd "artifacts/publish/$rid" && zip -qr "$OLDPWD/artifacts/dist/dbdatasync-v$SHIPPED-$rid.zip" .)
          done

      # The Windows installer (dist/msi.py), built from the win-x64 zip; the checksums cover it too.
      - uses: ./.github/actions/build-msi
        with:
          product: dbdatasync
          meta: DbDataSync/dist.json
          version: ${{ steps.version.outputs.version }}
          zip: DbDataSync/artifacts/dist/dbdatasync-v${{ steps.version.outputs.version }}-win-x64.zip
          out: DbDataSync/artifacts/dist

      - name: Checksums
        run: (cd artifacts/dist && sha256sum *.zip *.msi > SHA256SUMS && cat SHA256SUMS)

      - name: Smoke test the linux-x64 zip
        env:
          SHIPPED: ${{ steps.version.outputs.version }}
        run: |
          mkdir /tmp/zip-smoke
          unzip -q "artifacts/dist/dbdatasync-v$SHIPPED-linux-x64.zip" -d /tmp/zip-smoke
          reported=$(/tmp/zip-smoke/dbdatasync version)
          echo "dbdatasync version said: $reported"
          case "$reported" in *"$SHIPPED"*) ;; *) echo "expected $SHIPPED in that output"; exit 1 ;; esac

      # A dry run (suite-release.yml) keeps the files on the run instead of publishing them.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dry_run }}
        with:
          name: release-dbdatasync
          path: DbDataSync/artifacts/dist/*
          if-no-files-found: error

      # After the package is built and checked, not before: a tag is a claim that this version shipped, and it
      # should never exist for one that didn't. This is also *why* a failed run needs no tag cleanup
      # any more, unlike the tag-push-triggered shape this replaced — a run that fails anywhere above
      # this step simply leaves no trace at all, and a retry is just running the workflow again with a
      # freshly computed (and therefore always-unique) version, never a colliding tag to delete first.
      #
      # Lightweight, not annotated: an annotated tag needs a git author identity configured for
      # nothing this repo would use, since the one thing an annotation would carry — who, why — already
      # lives in the GitHub Release's own notes, the richer and more visible copy of the same
      # information. actions/checkout@v4's default persist-credentials is what makes a plain `git
      # push` here work with no further auth setup.
      - name: Tag this commit with the released version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "dbdatasync/v$VERSION"
          git push origin "refs/tags/dbdatasync/v$VERSION"

      # Created in this repository against the tag pushed above. The assets are the zips, the MSI and SHA256SUMS (artifacts/dist); the
      # install scripts and the Scoop manifest are attached by publish-dist below. ci.yml's package job builds a container image but only
      # ever tags it dbdatasync:ci locally, so no image is attached here (dispatch dbdatasync-publish-image.yml for that).
      # --latest=false because "latest" is one marker for the whole repository, not one per product.
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          {
            echo "\`dbdatasync\`, built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA."
            echo
            echo "The version is the UTC date and time this release was built."
            [ "$PRERELEASE" = "true" ] && echo "**This is a prerelease.**"
            echo
            echo "The zip packages (win-x64, linux-x64; they need the .NET 10 runtime) are installed with the install scripts attached to this release, or with Scoop on Windows; on Windows the .msi installs it (and registers the service) with a double-click. A container image is published by a separate workflow. There is no .NET tool package. See \`dist/README.md\` in the repository."
          } > /tmp/release-notes.md
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          gh release create "dbdatasync/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataSync $VERSION" \
            --notes-file /tmp/release-notes.md \
            "${prerelease_flag[@]}" \
            artifacts/dist/*

      - uses: ./.github/actions/publish-dist
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          product: dbdatasync
          meta: DbDataSync/dist.json
          version: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          sums: DbDataSync/artifacts/dist/SHA256SUMS
          sha: ${{ env.SHA }}
          msi: DbDataSync/artifacts/dist/dbdatasync-v${{ steps.version.outputs.version }}-win-x64.msi
