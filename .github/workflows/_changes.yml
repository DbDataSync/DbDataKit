name: Changed paths

# Did anything this product builds against change? Called by every product's CI as its first job (plan 13, F10), so the rule exists
# once. `build` is false when the pull request or push touched none of the paths, and the product's jobs are then skipped (the run still
# reports success). A run with no base to compare with (workflow_dispatch, a first push) treats everything as changed.
# `slow` is for Build's slower engines: after a merge and on request, and on a pull request only with the `ci:full` label.

on:
  workflow_call:
    inputs:
      paths:
        description: Extended regular expression matched against each changed file name; a match means the product's jobs run.
        type: string
        required: true
    outputs:
      build:
        description: "'true' when a listed path changed or there is nothing to compare with."
        value: ${{ jobs.changes.outputs.build }}
      slow:
        description: "'true' unless this is a pull request without the ci:full label."
        value: ${{ jobs.changes.outputs.slow }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      slow: ${{ steps.diff.outputs.slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PATHS: ${{ inputs.paths }}
        run: |
          build=true
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF"; range="$base...HEAD" ;;
            push)         base="$BEFORE"; range="$BEFORE..HEAD" ;;
            *)            base="" ;;
          esac
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            changed=$(git diff --name-only "$range")
            echo "changed in $range:"; echo "$changed"
            echo "$changed" | grep -qE "$PATHS" || build=false
          else
            echo "::notice::no base to compare with ($EVENT), so everything is treated as changed."
          fi
          slow=true
          if [ "$EVENT" = "pull_request" ]; then
            case ",$LABELS," in *,ci:full,*) ;; *) slow=false ;; esac
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "slow=$slow" >> "$GITHUB_OUTPUT"
