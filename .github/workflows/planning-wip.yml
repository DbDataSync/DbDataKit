name: Planning work in progress

# Nothing under planning/wip/ reaches main (planning/ROLES.md): a worker keeps its work-in-progress notes there on its task's branch and resolves and
# deletes them before it reports the branch ready. This runs on every pull request into main (no path filter, so a pull request that only adds a wip file
# is still checked) and on every push to main; it does not run on pushes to other branches, so a branch that carries wip files stays green.
# Make the job "No work in progress" a required check of main's branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-wip-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-wip:
    name: No work in progress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/check_no_wip.py
