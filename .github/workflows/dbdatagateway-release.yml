name: DbDataGateway release

# Cut a release by dispatching this against main (docs/releases.md):
#
#   gh workflow run dbdatagateway-release.yml --ref main -f beta=false
#   gh workflow run dbdatagateway-release.yml --ref main -f sha=<an older commit on main>
#
# It releases the newest commit on main, or `sha` (which must be on main), and only if that exact commit has a green "DbDataGateway CI" run.
# It packages the Windows zip (a Windows job), builds the Windows installer from it (dbdatagateway-v<version>-win-x64.msi, dist/msi.py, on Ubuntu),
# tags the commit dbdatagateway/v<version> and publishes a GitHub Release in THIS repository (zip, msi, SHA256SUMS, and the standard install.ps1 /
# Scoop manifest, bound by .github/actions/publish-dist from DbDataGateway/dist.json). No branch is pushed or merged: a release is a tag and its
# assets. Built-in GITHUB_TOKEN only.
#
# The version is CalVer, YYYY.M.D.HHmm from the UTC clock, like every product.

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      snapshot:
        description: >-
          Publish as a snapshot: a prerelease (-snapshot.g<sha> suffix) cut from any branch or commit with none of the release guards (not
          on main, no green CI run, no conformance gate). `sha` empty means the commit this run was dispatched against. Not with beta.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main and have a green DbDataGateway CI run.
        type: string
        default: ''
      version:
        description: The release version, exactly as it would be tagged (2026.10.30.1415 or 2026.10.30.1415-beta). Empty means the UTC clock now. suite-release.yml passes one so every product of a suite release has the same.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false
  # suite-release.yml calls this (plan 13a, L06), with dry_run for the suite's dry run.
  workflow_call:
    inputs:
      beta:
        description: Publish as a prerelease (-beta suffix on the version, prerelease flag on the GitHub Release).
        type: boolean
        default: false
      snapshot:
        description: >-
          Publish as a snapshot: a prerelease (-snapshot.g<sha> suffix) cut from any branch or commit with none of the release guards (not
          on main, no green CI run, no conformance gate). `sha` empty means the commit this run was dispatched against. Not with beta.
        type: boolean
        default: false
      sha:
        description: The commit to release. Empty means the newest commit on main. It must be on main and have a green DbDataGateway CI run.
        type: string
        default: ''
      version:
        description: The release version, exactly as it would be tagged (2026.10.30.1415 or 2026.10.30.1415-beta). Empty means the UTC clock now. suite-release.yml passes one so every product of a suite release has the same.
        type: string
        default: ''
      dry_run:
        description: Build everything and attach the files to the run (artifact "release-<product>"), but tag nothing and publish nothing.
        type: boolean
        default: false

permissions:
  contents: write
  # Reads the CI runs for the commit being released.
  actions: read

defaults:
  run:
    working-directory: DbDataGateway

jobs:
  package:
    runs-on: windows-latest
    # Observed: 3 minutes. The ceiling fails a hung build fast instead of after GitHub's six-hour default.
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the commit, which must be on main
        id: pick
        shell: bash
        working-directory: .
        env:
          WANTED: ${{ inputs.sha }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$SNAPSHOT" = "true" ]; then
            # A snapshot is cut from any branch or commit, with none of the release guards: the commit this run was dispatched against, or `sha`.
            sha=$(git rev-parse "${WANTED:-HEAD}^{commit}")
            echo "snapshot of $sha, dispatched against $GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::dbdatagateway-release.yml must be dispatched against 'main' (got '$GITHUB_REF_NAME'); pass -f sha=<commit> to release an older commit, or -f snapshot=true to cut a snapshot from this branch."
              exit 1
            fi
            git fetch origin main
            sha=$(git rev-parse "${WANTED:-origin/main}^{commit}")
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha is not on main. Only commits on main are released (a snapshot can be cut from anywhere: -f snapshot=true)."
              exit 1
            fi
          fi
          echo "releasing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          git checkout -q --detach "$sha"

      # A lookup, not a re-run: the run on main is the validation (a rebase merge makes new commits, so a pull request's own run is not theirs).
      - name: Require a green CI run for this exact commit
        if: ${{ !inputs.dry_run && !inputs.snapshot }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=success" \
            --jq '[.workflow_runs[] | select(.name == "DbDataGateway CI")] | length')
          echo "successful CI runs for $SHA: $green"
          if [ "$green" -lt 1 ]; then
            echo "::error::No successful DbDataGateway CI run for $SHA. Releasing a commit whose CI has not passed is exactly what this check exists to prevent. Dispatch 'DbDataGateway CI' on main, or pick a commit that has a run."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: DbDataGateway/global.json

      - name: Compute the version
        id: version
        shell: bash
        env:
          BETA: ${{ inputs.beta }}
          SNAPSHOT: ${{ inputs.snapshot }}
          PICKED_SHA: ${{ steps.pick.outputs.sha }}
          WANTED_VERSION: ${{ inputs.version }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          if [ "$SNAPSHOT" = "true" ]; then
            if [ "$BETA" = "true" ]; then echo "::error::choose beta or snapshot, not both"; exit 1; fi
            version="${version}-snapshot.g${PICKED_SHA:0:7}"
            prerelease=true
          fi
          # A version handed in (by suite-release.yml) wins over the clock; it must be CalVer, and -beta decides the prerelease flag.
          if [ -n "$WANTED_VERSION" ]; then
            case "$WANTED_VERSION" in
              [0-9][0-9][0-9][0-9].*.*.*) ;;
              *) echo "::error::'$WANTED_VERSION' is not a CalVer version (YYYY.M.D.HHmm[-beta|-snapshot])"; exit 1 ;;
            esac
            version="$WANTED_VERSION"
            case "$version" in *-beta|*-snapshot|*-snapshot.*) prerelease=true ;; *) prerelease=false ;; esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build/package.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: dbdatagateway-package
          path: DbDataGateway/artifacts/release/dbdatagateway-v*.zip
          if-no-files-found: error

  # Ubuntu, because the installer is built with wixl (apt) and the rest is shell. Nothing is tagged or published until the package and the
  # installer both exist: a tag is a claim that this version shipped, so a failed run leaves nothing to clean up.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.package.outputs.sha }}
      VERSION: ${{ needs.package.outputs.version }}
      PRERELEASE: ${{ needs.package.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: dbdatagateway-package
          path: assets

      - uses: ./.github/actions/build-msi
        with:
          product: dbdatagateway
          meta: DbDataGateway/dist.json
          version: ${{ env.VERSION }}
          zip: assets/dbdatagateway-v${{ env.VERSION }}-win-x64.zip
          out: assets

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # A dry run (suite-release.yml) keeps the files on the run instead of publishing them.
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.dry_run }}
        with:
          name: release-dbdatagateway
          path: assets/*
          if-no-files-found: error

      - name: Tag this commit with the released version
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          git tag "dbdatagateway/v$VERSION"
          git push origin "refs/tags/dbdatagateway/v$VERSION"

      - name: Publish the GitHub Release
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # --latest=false: "latest" is one marker for the whole repository, not one per product.
          gh release create "dbdatagateway/v$VERSION" \
            --verify-tag \
            --latest=false \
            --title "DbDataGateway $VERSION" \
            --notes "DbDataGateway $VERSION, packed from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. The version is the UTC date and time this release was built." \
            "${prerelease_flag[@]}" \
            assets/*

      - uses: ./.github/actions/publish-dist
        if: ${{ !inputs.dry_run }}
        with:
          product: dbdatagateway
          meta: DbDataGateway/dist.json
          version: ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          sums: assets/SHA256SUMS
          sha: ${{ env.SHA }}
          msi: assets/dbdatagateway-v${{ env.VERSION }}-win-x64.msi
