name: DbDataBuild CI

# DbDataBuild is the first product on the trunk model (docs/releases.md): short feature
# branches, a pull request into `main` that runs this, and a rebase merge. There is no dev/test lane and nothing here moves a branch.
#
#   pull request  the unit suite on Linux and Windows and the core conformance groups (SQL Server 2025 and PostgreSQL). The slow engines
#                 (SQL Server 2025, Oracle, Spark SQL, the BigQuery emulator) run too when the PR has the `ci:full` label.
#   push to main  everything, on the commit as it actually landed (a rebase merge makes new commits, so the PR's own run is not theirs).
#   nightly       dbdatabuild-conformance-full.yml, every engine in one job.
#
# Each run starts with `changes`: a push or PR that touches nothing of DbDataBuild's skips the suites and still reports success.
# Every group starts its engines with testenv/testenv.sh: the quick, apply and templates groups on SQL Server 2025 and PostgreSQL 17, the
# slow groups on the slow profiles (mssql2025, oracle, spark, bigquery).
#
# Ported from the product's own ci.yml (kept in this repo's history under DbDataBuild/).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Everything, slow engines included.
  workflow_dispatch:
  workflow_call:

# A newer push to a PR supersedes the older run; runs on main always complete.
concurrency:
  group: dbdatabuild-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: DbDataBuild

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    with:
      paths: '^(DbDataBuild/|DbDataKit/|testenv/|Directory\.(Build|Packages)\.props|global\.json|\.github/(workflows/(dbdatabuild-|_)|actions/setup-product))'

  # The server's container image (plan 13, L02): it builds, starts, goes healthy through its own health check, and the commands the README tells a person to run inside it work.
  image:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f DbDataBuild/Dockerfile -t dbdatabuild:ci .
      - name: Start it and wait for its health check
        run: |
          docker run -d --name ddb -p 8470:8470 dbdatabuild:ci
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ddb)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs ddb
          [ "$status" = healthy ] || { echo "the container is $status, not healthy" >&2; exit 1; }
      - name: Pair, add a login and answer a call
        run: |
          docker exec ddb dbdatabuild server pair --max-role viewer | grep -q "Pairing code:"
          printf 'secret' | docker exec -i ddb dbdatabuild secret set dbdata:build:connection:warehouse:read --stdin
          docker exec ddb dbdatabuild secret list | grep -q "dbdata:build:connection:warehouse:read"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8470/api/v1/projects)" = 401
          curl -skf https://localhost:8470/version | grep -q '"product":"dbdatabuild"'
          test "$(docker exec ddb id -u)" != 0

  unit:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    # Windows runs the same suite natively: the Wine runs in docs/progress entry 34 are no substitute.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25                 # the unit suite takes a few minutes; a hang should fail, not run for hours
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - run: dotnet build DbDataBuild.slnf -c Release
      - run: dotnet test tests/DbDataBuild.Tests.Unit -c Release --no-build

  # The Build runtime package (plan 28c E05): the engine published for the platform by scripts/publish-runtime.sh (the size check included), then the tests that need no
  # database engine: the manifest the script prints, a definition run by the runtime from read-only views with the engine unpacked once into the runner's cache, and the start of
  # three engines at once into one directory. On Windows as well (win-x64: long paths, the extraction directory under the cache).
  runtime-package:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    name: runtime package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh ${{ matrix.rid }}
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - name: Publish the runtime package
        shell: bash
        run: scripts/publish-runtime.sh ${{ matrix.rid }} "$RUNNER_TEMP/runtime"
      - run: dotnet build tests/DbDataBuild.Tests.Conformance -c Release
      - name: Runtime package tests
        shell: bash
        env:
          DBDATABUILD_TEST_PUBLISHED: ${{ runner.temp }}/runtime
        run: dotnet test tests/DbDataBuild.Tests.Conformance -c Release --no-build --filter "Group=runtime-package"

  # The web page in a real browser (B-PW): `dbdatabuild ui mcp` serves it by a one-time link, over a starter project; every screen, the plans screen, the apply panel and the markup rule
  # (tests/DbDataBuild.Web.Tests). Each spec starts its own server, so nothing here needs a port or an engine.
  playwright:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - run: dotnet build src/DbDataBuild.Cli -c Debug
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the browser
        working-directory: DbDataBuild/tests/DbDataBuild.Web.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: DbDataBuild/tests/DbDataBuild.Web.Tests
        run: npx playwright test

  # The conformance suite against real engines, in groups that run side by side (each starts only the engines it needs): `quick` is
  # everything not named below, `apply` is the whole plan and apply loop, `templates` builds the sample projects and compares every
  # table with DuckDB, `release` (the sample projects again with the rewrites off) runs only in dbdatabuild-conformance-full.yml.
  conformance:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: quick,     filter: "Group!=apply&Group!=templates&Group!=release&Group!=runtime-package" }
          - { group: apply,     filter: "Group=apply" }
          - { group: templates, filter: "Group=templates&Group!=release" }
    name: conformance (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - run: dotnet build DbDataBuild.slnf -c Release
      - name: Start the engines (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up mssql postgres
      - name: Conformance tests
        run: |
          eval "$(../testenv/testenv.sh env dbdatabuild)"
          dotnet test tests/DbDataBuild.Tests.Conformance -c Release --no-build --filter "${{ matrix.filter }}"
      - name: Stop the engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down

  # `mssql2025` runs the dialect probes and one whole load against a SQL Server 2025 (database compatibility level 170, and 160). The
  # preview engines (Oracle, Spark SQL, the BigQuery emulator) are only probed for their dialect: a failure there means a case that agreed
  # with DuckDB no longer does (tests/.../Baselines). Slow to start, so they run after a merge, nightly, and on a PR labelled `ci:full`.
  conformance-slow:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' && needs.changes.outputs.slow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: mssql2025, engines: "mssql2025", filter: "DisplayName~sqlserver2025|DisplayName~A_project_at_version_17" }
          - { group: oracle,    engines: "oracle",   filter: "DisplayName~EngineDifferenceProbes&DisplayName~oracle" }
          - { group: spark,     engines: "spark",    filter: "DisplayName~EngineDifferenceProbes&DisplayName~spark" }
          - { group: bigquery,  engines: "bigquery", filter: "DisplayName~EngineDifferenceProbes&DisplayName~bigquery" }
    name: conformance (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-product
        with:
          product: DbDataBuild
          duckdb: 'false'
      - name: Prebuilt polyglot library
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-native.sh
      - name: Pinned DuckDB engine
        shell: bash
        working-directory: .
        run: scripts/fetch-duckdb.sh
      - run: dotnet build DbDataBuild.slnf -c Release
      - name: Start the engines (shared test engines)
        working-directory: .
        run: testenv/testenv.sh up ${{ matrix.engines }}
      - name: Conformance tests
        run: |
          eval "$(../testenv/testenv.sh env dbdatabuild)"
          dotnet test tests/DbDataBuild.Tests.Conformance -c Release --no-build --filter "${{ matrix.filter }}"
      - name: Stop the engines
        if: always()
        working-directory: .
        run: testenv/testenv.sh down
