name: Merge a release into main, then back into every dev branch
description: >-
  The last step of every product's release. Merges the released <product>/test commit into main with a merge commit
  (other products release independently, so main cannot fast-forward), then merges main back into this product's own
  lane and into every other <product>/dev branch, so nothing waits for the next release to find out it has drifted.
  See docs/plans/09-MONOREPO-BRANCHING-AND-RELEASES.md. The calling job must have checked out full history
  (fetch-depth: 0) with the default GITHUB_TOKEN credentials, and have contents, actions and issues write permission.

inputs:
  product:
    description: The product's lowercase name, which is also its branch prefix (dbdatasync, dbdataproxy, dbdatabuild).
    required: true
  version:
    description: The released version, for the merge commit message.
    required: true
  sha:
    description: The released commit, which is the tip of <product>/test.
    required: true
  token:
    description: Token for the gh CLI (dispatching CI, opening an issue). The caller passes secrets.GITHUB_TOKEN.
    required: true

outputs:
  main-sha:
    description: The merge commit now at the tip of main.
    value: ${{ steps.main.outputs.sha }}

runs:
  using: composite
  steps:
    # `main` is the integration branch for every product, so it can't be fast-forwarded to this commit. The merge
    # commit's first-parent history is the list of releases. Products live in separate directories and the release
    # workflow checked that main is already an ancestor of the released commit, so a conflict can only be shared code
    # that another product changed meanwhile, and it fails loudly here instead of being guessed at.
    - name: Merge ${{ inputs.product }}/test into main
      id: main
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PRODUCT: ${{ inputs.product }}
        VERSION: ${{ inputs.version }}
        SHA: ${{ inputs.sha }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git switch --detach origin/main
        # [skip ci]: the merge commit's tree equals a commit that already passed CI, and it is pushed to the lane's own
        # dev and test below, where a fresh run would only repeat the suite for nothing.
        git merge --no-ff -m "Release $PRODUCT $VERSION [skip ci]" "$SHA"
        git push origin "HEAD:refs/heads/main"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Immediate back-merge. A push made with GITHUB_TOKEN starts no workflow, so each merged dev branch gets its CI
    # dispatched by hand, and that run's promote job carries the merge on to <product>/test.
    #
    #   * Own lane, dev unchanged since the release: fast-forward <product>/dev AND <product>/test to the merge commit. Its
    #     tree is a tested commit's tree, so no new run is needed, and it is what lets the next release's ancestor check
    #     pass without waiting for one.
    #   * Own lane, dev has moved on: merge main into dev, then dispatch its CI, which promotes it to test.
    #   * Other products: merge main into <product>/dev. A conflict is never resolved by guessing: the job opens an issue
    #     and fails after trying every branch, and the release itself has already succeeded.
    - name: Merge main back into every dev branch
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        PRODUCT: ${{ inputs.product }}
        VERSION: ${{ inputs.version }}
        SHA: ${{ inputs.sha }}
        MAIN_SHA: ${{ steps.main.outputs.sha }}
      run: |
        git fetch origin '+refs/heads/*:refs/remotes/origin/*'
        failed=()

        if [ "$(git rev-parse "origin/$PRODUCT/dev")" = "$SHA" ]; then
          git push origin "$MAIN_SHA:refs/heads/$PRODUCT/dev" "$MAIN_SHA:refs/heads/$PRODUCT/test" \
            || failed+=("$PRODUCT/dev + $PRODUCT/test (fast-forward)")
        fi

        for branch in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/*/dev' | grep -E '^[a-z0-9]+/dev$'); do
          if [ "$branch" = "$PRODUCT/dev" ] && [ "$(git rev-parse "origin/$PRODUCT/dev")" = "$SHA" ]; then
            continue
          fi
          git switch --detach "origin/$branch"
          if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            continue
          fi
          if git merge --no-ff -m "Merge main into $branch after $PRODUCT $VERSION" "$MAIN_SHA"; then
            if git push origin "HEAD:refs/heads/$branch"; then
              # A product with no CI workflow yet has nothing to start.
              lane=${branch%%/*}
              if git cat-file -e "$MAIN_SHA:.github/workflows/$lane-ci.yml" 2>/dev/null; then
                gh workflow run "$lane-ci.yml" --ref "$branch" || failed+=("$branch (CI dispatch)")
              fi
            else
              failed+=("$branch (push)")
            fi
          else
            git merge --abort
            failed+=("$branch (conflict)")
          fi
        done

        if [ "${#failed[@]}" -gt 0 ]; then
          printf '%s\n' "${failed[@]}" > "$RUNNER_TEMP/failed-backmerges.txt"
          gh issue create \
            --title "Back-merge after $PRODUCT $VERSION needs attention" \
            --body "The release of $PRODUCT $VERSION merged into main ($MAIN_SHA), but main could not be merged back into: $(paste -sd, "$RUNNER_TEMP/failed-backmerges.txt"). Merge main into each by hand and resolve the conflicts. Releases from those lanes are blocked until main is an ancestor of their <product>/test. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error::back-merge failed for: ${failed[*]}"
          exit 1
        fi
