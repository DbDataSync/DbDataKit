schemaVersion: 1
kind: grid
title: Territories
model: territories
entity: territory
columns:
  - {attribute: code, sortable: true}
  - {attribute: name, label: Territory, sortable: true}
  - {attribute: quota, sortable: true}
filters: [name]
sort: [{attribute: code, direction: asc}]
pageSize: 25
links:
  - {label: Add a territory, to: views/new.yaml}
  - {label: Open, to: views/detail.yaml, row: true, with: {code: $code}}
  - {label: Edit, to: views/edit.yaml, row: true, with: {code: $code}}
