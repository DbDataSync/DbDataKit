# A DuckDB source without allow_writes runs in a sandbox: the file is opened READ_ONLY, queries cannot read other files, ATTACH, COPY ... TO,
# INSTALL or LOAD, and the settings are locked. allowed_directories is the one exception, for a source that deliberately serves a folder
# of files (absolute paths; nothing else opens).
schema: connection/1
name: lake
engine: duckdb
connection_string: "Data Source=C:\\data\\lake.duckdb"
extensions:
  proxy:
    allowed_directories: ['C:\data\parquet']
