# How clients prove who they are. People are the identity home's (personal access tokens, a home token, Windows); Proxy has no users of its own.
# A person's data sources are the ones whose files under connections/ name a group of the home they are in (extensions.proxy.groups).
sessionIdleMinutes: 30
sessionMaxHours: 12
allowPassThrough: true

# Windows sign-in (Windows only): the user name is the person's UPN (ada@corp.example), the password is checked by the operating system, and the account is
# the identity home's user who holds that address as a verified one.
# windows: true

# JWT with a shared HMAC key:
# jwt:
#   signingKey: file:C:\secrets\jwt.key
#   audience: api://dbproxy
#   mappings: [ ... ]
