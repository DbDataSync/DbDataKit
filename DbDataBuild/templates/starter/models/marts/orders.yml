# `schemaVersion: 2` is what lets a model file carry `checks` (data quality checks, stored with the model; read and validated here, run later).
schemaVersion: 2
name: marts.orders
title: Orders
description: "One row per order, with the amount paid by each payment method."
tags: [order, finance]
properties: {owner: finance, refresh: daily, pii: false}
kind: full
grain: [order_id]
columns:
  - {name: order_id, type: INTEGER, nullable: false, checks: [{id: orders_order_id_unique, kind: unique, severity: block}]}
  - {name: customer_id, type: INTEGER, nullable: false}
  - {name: order_date, type: DATE, nullable: false}
  - {name: status, type: "VARCHAR(20)", nullable: false, checks: [{id: orders_status_known, kind: accepted_values, values: [placed, shipped, completed, return_pending, returned]}]}
  - {name: status_group, type: "VARCHAR(10)", nullable: false}
  - {name: credit_card_amount, type: "DECIMAL(14, 2)"}
  - {name: bank_transfer_amount, type: "DECIMAL(14, 2)"}
  - {name: coupon_amount, type: "DECIMAL(14, 2)"}
  - {name: gift_card_amount, type: "DECIMAL(14, 2)"}
  - {name: amount, type: "DECIMAL(14, 2)", description: "The total paid, in dollars.", properties: {unit: USD}}
checks:
  - {id: orders_customer_present, kind: not_null, column: customer_id, severity: block}
  - {id: orders_amount_not_negative, kind: range, column: amount, min: 0}
  - {id: orders_fresh, kind: freshness, column: order_date, max_age: 2d}
  - {id: orders_row_count_stable, kind: row_count_change, max_decrease_percent: 50}
indexes:
  - {name: ux_orders_order_id, columns: [order_id], unique: true}
