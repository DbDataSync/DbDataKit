# The product, for somebody who wants to run it rather than develop it.
#
# Deliberately a second file: docker-compose.yml stands up the test databases this repo develops
# against, and folding the application into it would make "start my test databases" also start an
# application.
#
#   docker compose -f docker-compose.app.yml up
#
# This builds the image from this checkout. To run a published release instead, replace `build:` with
#   image: ghcr.io/dbdatasync/dbdatasync:latest
# (docs/install.md, "Running in a container", lists the tags; the image is published for amd64 and arm64).
services:
  dbdatasync:
    build:
      # The repository root: the image build needs the sibling DbDataKit/ folder as well as this one.
      context: ..
      dockerfile: DbDataSync/Dockerfile
    container_name: dbdatasync
    environment:
      # Evaluation only: plain HTTP is otherwise served just to the same machine or to a trusted TLS-terminating proxy, and a
      # browser reaching this container through Docker's port mapping is neither. Behind a proxy, drop this and set
      # DbDataSync__App__TrustedProxies to the proxy's address instead. See docs/configuration.md.
      DbDataSync__App__AllowInsecureHttp: "true"
    ports:
      - "8080:8080"
    volumes:
      - dbdatasync-data:/var/lib/dbdatasync
    restart: unless-stopped

volumes:
  dbdatasync-data:
