<!-- the sample region control -->
<div class="vz-control vz-control-multiselect" data-testid="vz-control-regions"><span class="vz-control-label">Region</span><div id="vz-control-regions" class="vz-choices" role="group" aria-label="Region"><label class="vz-choice"><input type="checkbox" checked=""/> West</label><label class="vz-choice"><input type="checkbox"/> Central</label><label class="vz-choice"><input type="checkbox"/> East</label><label class="vz-choice"><input type="checkbox" checked=""/> South</label></div></div>

<!-- select -->
<div class="vz-control vz-control-select" data-testid="vz-control-select"><label class="vz-control-label" for="vz-control-select">Region</label><select id="vz-control-select" class="vz-input"><option value="">All</option><option value="West">West</option><option value="East" selected="">The East</option></select></div>

<!-- multiselect -->
<div class="vz-control vz-control-multiselect" data-testid="vz-control-multiselect"><span class="vz-control-label">Regions</span><div id="vz-control-multiselect" class="vz-choices" role="group" aria-label="Regions"><label class="vz-choice"><input type="checkbox" checked=""/> West</label><label class="vz-choice"><input type="checkbox"/> The East</label></div></div>

<!-- date -->
<div class="vz-control vz-control-date" data-testid="vz-control-date"><label class="vz-control-label" for="vz-control-date">Day</label><input id="vz-control-date" class="vz-input" type="date" value="2026-03-01"/></div>

<!-- daterange -->
<div class="vz-control vz-control-daterange" data-testid="vz-control-daterange"><span class="vz-control-label">Period</span><div id="vz-control-daterange" class="vz-choices" role="group" aria-label="Period"><label class="vz-choice">From <input class="vz-input" type="date" max="2026-02-01" value="2026-01-01"/></label><label class="vz-choice">To <input class="vz-input" type="date" min="2026-01-01" value="2026-02-01"/></label></div></div>

<!-- number -->
<div class="vz-control vz-control-number" data-testid="vz-control-number"><label class="vz-control-label" for="vz-control-number">Top</label><input id="vz-control-number" class="vz-input" type="number" value="5"/></div>

<!-- text -->
<div class="vz-control vz-control-text" data-testid="vz-control-text"><label class="vz-control-label" for="vz-control-text">Search</label><input id="vz-control-text" class="vz-input" type="text" value="abc"/></div>

<!-- toggle -->
<div class="vz-control vz-control-toggle" data-testid="vz-control-toggle"><label class="vz-control-label" for="vz-control-toggle">Only open</label><input id="vz-control-toggle" type="checkbox" role="switch" checked=""/></div>
