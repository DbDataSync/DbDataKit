# The console and a Gateway, paired by announcement (see build.yml for the mechanism; the commands are the same with `-f dist/compose/gateway.yml`):
#   docker compose -f dist/compose/gateway.yml exec console dotnet /app/dbdatakit.dll instance confirm dbdatagateway
# The Gateway's management API is on by default and listens on the loopback address; here it listens on every address of the container (port 8816, not
# published: only the console, on this network, reaches it) and the address the console is told to use is fixed in this file. The Flight port (8815) is published for clients.
# Run from the repository root.
name: dbdatakit-gateway
x-announce: &announce
  DBDATAKIT_ANNOUNCE_URL: http://console:8481
services:
  console:
    build:
      context: ../..
      dockerfile: DbDataKit/Dockerfile
    environment: *announce
    ports:
      - "8480:8480"
    volumes:
      - console-data:/data
  gateway:
    build:
      context: ../..
      dockerfile: DbDataGateway/Dockerfile
    # the name the server announces; the service name is already a name of it on this network
    hostname: gateway
    environment:
      <<: *announce
      DBDATAKIT_Gateway__Management__Address: 0.0.0.0
      DBDATAKIT_Gateway__Management__Port: "8816"
      # the console reaches the management API here, by name, whatever address the container gets
      DBDATAKIT_ADVERTISE_URL: https://gateway:8816
      DBDATAKIT_INSTANCE_NAME: dbdatagateway
    ports:
      - "8815:8815"
    volumes:
      - gateway-data:/data
    depends_on:
      - console
volumes:
  console-data:
  gateway-data:
