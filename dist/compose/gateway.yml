# The console and a Gateway, paired by announcement. One setting is shared by the whole file: where the console takes announcements.
# The console listens there (on a port that is not published, so only containers of this network reach it) and every server announces there;
# the server announces its host name, which the console resolves on this network (so a server that gets a new IP address stays paired; its address is used when the name does not resolve). A server waits as pending until an administrator confirms it
# (or in the web app); another server is another service with `environment: *announce`:
#   docker compose -f dist/compose/gateway.yml exec console dotnet /app/dbdatakit.dll instance confirm dbdatagateway
# The Gateway's management API is on by default and listens on the loopback address; here its `listen` is every address of the container (port 7822, not
# published: only the console, on this network, reaches it) and the address the console is told to use is fixed in this file. The Flight port (7821) is published for clients.
# Run from the repository root.
name: dbdatakit-gateway
x-announce: &announce
  DBDATAKIT_ANNOUNCE_URL: http://console:7801
services:
  console:
    build:
      context: ../..
      dockerfile: DbDataKit/Dockerfile
    environment: *announce
    ports:
      - "7800:7800"
    volumes:
      - console-data:/data
  gateway:
    build:
      context: ../..
      dockerfile: DbDataGateway/Dockerfile
    # the name the server announces; the service name is already a name of it on this network
    hostname: gateway
    environment:
      <<: *announce
      DBDATAKIT_Gateway__Management__Listen: https://0.0.0.0:7822
      # the console reaches the management API here, by name, whatever address the container gets
      DBDATAKIT_ADVERTISE_URL: https://gateway:7822
      DBDATAKIT_INSTANCE_NAME: dbdatagateway
    ports:
      - "7821:7821"
    volumes:
      - gateway-data:/data
    depends_on:
      - console
volumes:
  console-data:
  gateway-data:
