# Everything on one machine, for trying the suite out: the console and a Gateway (the Build and Sync servers were deleted, plan 33 SC23: a Build project or a replication is authored in a Workspace and runs on a Runner), and a PostgreSQL with demo data.
# Every server announces itself to the console and waits to be confirmed. See docs/quickstart.md. Run from the repository root:
#   docker compose -f dist/compose/quickstart.yml up -d --build --wait
# Not for production: the demo database has a published password and a published port.
name: dbdatakit-quickstart
x-announce: &announce
  DBDATAKIT_ANNOUNCE_URL: http://console:8481
services:
  console:
    build:
      context: ../..
      dockerfile: DbDataKit/Dockerfile
    environment: *announce
    ports:
      - "8480:8480"
    volumes:
      - console-data:/data
  gateway:
    build:
      context: ../..
      dockerfile: DbDataGateway/Dockerfile
    hostname: gateway
    environment:
      <<: *announce
      DBDATAKIT_Gateway__Management__Address: 0.0.0.0
      DBDATAKIT_Gateway__Management__Port: "8816"
      DBDATAKIT_ADVERTISE_URL: https://gateway:8816
      DBDATAKIT_INSTANCE_NAME: dbdatagateway
    ports:
      - "8815:8815"
    volumes:
      - gateway-data:/data
    depends_on:
      - console
  # Demo data to point the servers at: host demo-db, port 5432, user demo, password demo, databases demo, demo_target and mdm. From the machine: localhost:15434.
  demo-db:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "15434:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
      - ./quickstart/demo.sql:/docker-entrypoint-initdb.d/demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  console-data:
  gateway-data:
  demo-data:
